<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>阿梅委託管理清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --border:#e5e7eb;
    --text:rgba(0,0,0,.78);
    --muted:rgba(0,0,0,.48);
    --accent:rgb(110,180,135);
    --accentSoft:rgba(110,180,135,.12);
    --accentBorder:rgba(110,180,135,.30);
    --purple:rgb(167,142,220);
    --purpleSoft:rgba(167,142,220,.14);
    --purpleBorder:rgba(167,142,220,.35);
    --danger:rgb(164,43,57);
    --shadow:0 10px 28px rgba(0,0,0,.07);
    --shadow-sm:0 6px 18px rgba(0,0,0,.05);
    --radius:18px;
    --form-gap:10px;
    --cell-pad:8px 9px;
  }

  *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }

  body{
    padding:20px 16px 48px;
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",Arial;
    font-size:13px;
  }

  h1{ font-size:20px; font-weight:950; margin-bottom:16px; letter-spacing:.2px; }

  a{ color:var(--accent); text-decoration:none; font-weight:800; }
  a:hover{ text-decoration:underline; }

  /* ===== 通用卡片 ===== */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    margin-bottom:14px;
  }

  /* ===== 表單 fieldset 分組 ===== */
  .form-groups{ display:grid; gap:10px; }

  .form-group{
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 14px 14px;
    background:#fff;
  }

  .form-group legend{
    padding:0 7px;
    font-size:11px;
    font-weight:950;
    color:var(--muted);
    letter-spacing:.5px;
    text-transform:uppercase;
  }

  .form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
    gap:var(--form-gap);
    margin-top:10px;
  }

  .form label{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
  }

  input:not([type="checkbox"]):not([type="file"]),
  select{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
    color:var(--text);
    font-size:13px;
    font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--accentBorder);
    box-shadow:0 0 0 4px var(--accentSoft);
  }

  /* ===== 按鈕通則 ===== */
  button{
    font-family:inherit;
    cursor:pointer;
    transition:transform .06s ease, background .15s ease, box-shadow .15s ease;
  }
  button:active{ transform:translateY(1px); }

  /* ===== 表單按鈕列 ===== */
  .row-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }

  /* 新增委託（主要按鈕） */
  .row-actions > button:first-child{
    padding:10px 18px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:900;
    font-size:13px;
  }
  .row-actions > button:first-child:hover{ background:rgb(90,160,115); }

  /* 次要按鈕 */
  button.secondary{
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    font-weight:900;
    font-size:13px;
  }
  button.secondary:hover{ background:#f9fafb; box-shadow:var(--shadow-sm); }

  /* 排序 badge */
  .sort-badge{
    padding:5px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:#fff;
    font-size:12px;
    font-weight:800;
    color:var(--muted);
  }

  .hint{ color:var(--muted); font-size:12px; }

  /* ===== 控制列（月份、收入、備份、視圖） ===== */
  .list-controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:12px;
  }

  .month-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
  }

  .month-tab{
    border:1px solid var(--border);
    background:#fff;
    color:var(--muted);
    padding:6px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .month-tab:hover{ background:#f3f4f6; }
  .month-tab.active{
    border-color:var(--accentBorder);
    background:var(--accentSoft);
    color:rgba(0,0,0,.72);
  }

  .month-income,
  .backup-status{
    display:inline-flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding:8px 13px;
    border-radius:12px;
    font-size:12px;
    font-weight:900;
  }
  .month-income{
    background:var(--accentSoft);
    border:1px solid var(--accentBorder);
    color:rgba(0,0,0,.75);
  }
  .backup-status{
    background:var(--purpleSoft);
    border:1px solid var(--purpleBorder);
    color:rgba(0,0,0,.70);
  }
  .backup-status button{
    padding:4px 9px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12px;
    font-weight:900;
    color:var(--text);
  }
  .backup-status button:hover{ background:#f3f4f6; }
  .github-sync-status{
    background:rgba(56,132,214,.10);
    border:1px solid rgba(56,132,214,.28);
    color:rgba(0,0,0,.70);
  }
  .copy-btn{
    background:var(--accentSoft) !important;
    border-color:var(--accentBorder) !important;
    color:rgb(40,110,75) !important;
  }
  .copy-btn:hover{ background:rgba(110,180,135,.20) !important; }
  .copy-btn:disabled{ opacity:.7; cursor:default; }
  .backup-restore-btn{
    background:rgba(164,43,57,.08) !important;
    border-color:rgba(164,43,57,.35) !important;
    color:var(--danger) !important;
  }
  .backup-restore-btn:hover{ background:rgba(164,43,57,.15) !important; }

  /* ── 操作欄 icon 按鈕群 ── */
  .action-cell{ display:flex; gap:4px; align-items:center; justify-content:center; flex-wrap:nowrap; }
  .act-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--border);
    background:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .12s, border-color .12s, transform .05s;
    padding:0; flex-shrink:0;
  }
  .act-btn:hover{ background:#f3f4f6; transform:scale(1.08); }
  .act-btn:active{ transform:scale(.96); }
  .act-btn.on{ background:var(--accentSoft); border-color:var(--accentBorder); }
  .act-btn.on-done{ background:rgba(22,163,74,.10); border-color:rgba(22,163,74,.30); }
  .act-btn.on-public{ background:rgba(56,132,214,.10); border-color:rgba(56,132,214,.30); }
  .act-btn.del{ border-color:rgba(220,38,38,.22); background:rgba(220,38,38,.06); }
  .act-btn.del:hover{ background:rgba(220,38,38,.13); }

  /* ── 欄位摺疊 ── */
  .col-hidden{ display:none !important; }

  /* ── 欄位設定面板 ── */
  .col-toggle-wrap{ position:relative; display:inline-block; }
  .col-toggle-panel{
    display:none; position:absolute; top:calc(100% + 6px); right:0;
    background:#fff; border:1px solid var(--border); border-radius:14px;
    box-shadow:0 10px 28px rgba(0,0,0,.10); padding:12px 14px;
    z-index:200; min-width:180px; white-space:nowrap;
  }
  .col-toggle-panel.open{ display:block; }
  .col-toggle-panel .panel-title{ font-size:11px; font-weight:900; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px; }
  .col-toggle-row{ display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; cursor:pointer; }
  .col-toggle-row input{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }

  /* 視圖切換 */
  .view-switch{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
  }
  .view-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--muted);
    padding:6px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .view-btn:hover{ background:var(--purpleSoft); border-color:var(--purpleBorder); }
  .view-btn.active{ background:var(--purpleSoft); border-color:var(--purpleBorder); color:var(--text); }

  /* ===== 表格 ===== */
  .table-wrap{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:14px;
  }

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
    font-size:12px;
  }

  th, td{
    padding:var(--cell-pad);
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:middle;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tr:last-child td{ border-bottom:none; }

  th{
    position:sticky;
    top:0;
    z-index:1;
    background:#fafafa;
    color:var(--muted);
    font-weight:950;
    font-size:11px;
  }

  #list tr:hover{ background:var(--purpleSoft) !important; }
  tr.urgent{ background:rgba(220,38,38,.06); }
  tr.warning{ background:rgba(234,179,8,.08); }
  tr.done{ color:#aaa; background:#fcfcfc; }

  .col-narrow-center, td.col-narrow-center{ text-align:center; }
  .col-days{ text-align:center; }
  td.col-pay{ overflow:hidden; }
  td.td-wide, th.td-wide{ white-space:normal; }

  /* 倒數 pill */
  .pill{
    display:inline-flex;
    align-items:center;
    padding:3px 9px;
    border:1px solid var(--accentBorder);
    border-radius:999px;
    background:var(--accentSoft);
    color:rgb(40,120,75);
    font-size:10px;
    font-weight:900;
  }

  /* 表格內小輸入框 */
  .tbl-input{
    width:78px;
    max-width:78px;
    padding:5px 8px;
    border-radius:9px;
    border:1px solid var(--border);
    font-size:12px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  .tbl-input:focus{ border-color:var(--accentBorder); box-shadow:0 0 0 3px var(--accentSoft); }

  input[type="date"].tbl-input{
    width:122px !important;
    max-width:122px !important;
  }

  .tbl-note{
    width:125px;
    max-width:125px;
    padding:5px 7px;
    border-radius:9px;
    border:1px solid var(--border);
    font-size:12px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  .tbl-note:focus{ border-color:var(--accentBorder); box-shadow:0 0 0 3px var(--accentSoft); }

  /* 聯絡欄 */
  .linkrow{ display:flex; align-items:center; gap:5px; }
  .linkrow-contact{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:5px;
  }
  .linkrow-contact a,
  .linkrow-contact span{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .linkrow-contact button{ flex:0 0 auto; }
  td.col-contact{ display:table-cell !important; vertical-align:middle; }

  /* 小按鈕群 */
  .btn-icon{
    padding:5px 9px;
    border-radius:9px;
    border:1px solid rgba(220,38,38,.25);
    background:rgba(220,38,38,.07);
    font-size:12px;
    font-weight:900;
    color:rgb(153,27,27);
  }
  .btn-icon:hover{ background:rgba(220,38,38,.12); }

  .contact-edit{
    flex:0 0 auto;
    padding:3px 7px;
    border-radius:7px;
    border:1px solid var(--purpleBorder);
    background:#fff;
    color:var(--purple);
    font-size:12px;
    font-weight:900;
  }
  .contact-edit:hover{ background:var(--purpleSoft); }

  .btn-order{
    width:21px; height:21px;
    border-radius:50%;
    border:1px solid var(--purpleBorder);
    background:#fff;
    color:var(--purple);
    font-size:11px;
    font-weight:900;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .btn-order:hover{ background:var(--purpleSoft); }

  /* 付款狀態 select */
  .col-pay select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    padding:4px 22px 4px 9px;
    border:1px solid transparent;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    font-family:inherit;
    cursor:pointer;
    background-repeat:no-repeat;
    background-position:right 8px center, right 4px center;
    background-size:5px 5px, 5px 5px;
    background-image:
      linear-gradient(45deg, transparent 50%, rgba(0,0,0,.4) 50%),
      linear-gradient(135deg, rgba(0,0,0,.4) 50%, transparent 50%);
    outline:none;
  }
  .pay-unpaid{ background-color:rgba(220,38,38,.10); border-color:rgba(220,38,38,.22); color:rgb(153,27,27); }
  .pay-deposit{ background-color:rgba(37,99,235,.10); border-color:rgba(37,99,235,.22); color:rgb(29,78,216); }
  .pay-paid{ background-color:rgba(22,163,74,.10); border-color:rgba(22,163,74,.22); color:rgb(21,128,61); }

  /* 完成列全部轉灰 */
  tr.done .pill,
  tr.done input,
  tr.done a{ color:#bbb !important; }
  tr.done .col-pay select,
  tr.done .col-pay select.pay-unpaid,
  tr.done .col-pay select.pay-deposit,
  tr.done .col-pay select.pay-paid{
    background-color:#f2f3f4 !important;
    border-color:#e0e0e0 !important;
    color:#aaa !important;
  }
  tr.done button{
    background:#f2f3f4 !important;
    border-color:#e0e0e0 !important;
    color:#bbb !important;
    box-shadow:none !important;
  }

  /* ===== 卡片 view ===== */
  .card-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:12px;
    margin-top:4px;
  }

  .comm-card{
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
    box-shadow:var(--shadow-sm);
    padding:13px 14px;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .comm-card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,.10);
    border-color:var(--purpleBorder);
  }
  .comm-card.urgent{ border-color:rgba(220,38,38,.35); background:rgba(220,38,38,.04); }
  .comm-card.warning{ border-color:rgba(234,179,8,.40); background:rgba(234,179,8,.05); }
  .comm-card.done{ opacity:.6; filter:grayscale(.2); }

  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .card-name{
    font-weight:950; font-size:16px; color:var(--purple);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-pill{
    padding:3px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    background:var(--purpleSoft);
    border:1px solid var(--purpleBorder);
    color:rgba(0,0,0,.60);
    flex-shrink:0;
  }
  .card-row{ font-size:12px; color:rgba(0,0,0,.65); margin-bottom:4px; line-height:1.5; }
  .card-row b{ color:rgba(0,0,0,.82); font-weight:800; }
  .card-actions{
    display:flex; gap:8px; align-items:center;
    margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border); flex-wrap:wrap;
  }
  .card-chk{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; cursor:pointer; }

  input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
</style>
</head>
<body>

<h1>阿梅委託管理清單</h1>

<div class="card">
  <div class="form-groups">
    <fieldset class="form-group">
      <legend>基本資料</legend>
      <div class="form">
        <label>委託人暱稱
          <input id="name" placeholder="例如：阿花/匿名A">
        </label>

        <label>委託項目
          <input id="item" list="itemOptions" placeholder="可選或自行輸入">
          <datalist id="itemOptions">
            <option value="大頭"></option>
            <option value="半身"></option>
            <option value="立繪"></option>
            <option value="組合頁A"></option>
            <option value="組合頁B"></option>
            <option value="性轉組合頁"></option>
            <option value="迷你Q"></option>
          </datalist>
        </label>

        <label>月份
          <select id="month"></select>
        </label>
      </div>
    </fieldset>

    <fieldset class="form-group">
      <legend>聯絡與資料</legend>
      <div class="form">
        <label>聯絡方式
          <select id="contactType" onchange="toggleContactCustom()">
            <option>Facebook</option>
            <option>Plurk</option>
            <option>Threads</option>
            <option>Discord</option>
            <option value="自訂">自訂</option>
          </select>
        </label>

        <label id="contactCustomLabel" style="display:none;">自訂聯絡方式
          <input id="contactCustom" placeholder="例如：X / IG / E-mail">
        </label>

        <label>聯絡方式網址 / ID
          <input id="contactUrl" placeholder="網址、帳號、ID 都可以">
        </label>

        <label>委託資料（網址）
          <input id="dataUrl" placeholder="https://...">
        </label>
      </div>
    </fieldset>

    <fieldset class="form-group">
      <legend>日期與金額</legend>
      <div class="form">
        <label>開工日（可不填）
          <input type="date" id="start">
        </label>

        <label>DDL（建議必填）
          <input type="date" id="ddl">
        </label>

        <label>訂金（可不填）
          <input id="deposit" placeholder="例如：500">
        </label>

        <label>價格
          <input id="price" placeholder="例如：1500">
        </label>

        <label>付款狀態
          <select id="pay">
            <option>未付款</option>
            <option>已付訂金</option>
            <option>已付清</option>
          </select>
        </label>
      </div>
    </fieldset>
  </div>

  <div class="row-actions">
    <button type="button" onclick="addRow()">新增委託</button>
    <button type="button" class="secondary" onclick="toggleSortMode()">切換排序</button>
    <span id="sortModeBadge" class="sort-badge">依 DDL 自動排序</span>
  </div>
</div>

<div class="card">
  <div id="monthTabs" class="month-tabs"></div>
  <div id="monthIncome" class="month-income"></div>
  <div id="backupStatus" class="backup-status"></div>
  <div id="githubSyncStatus" class="backup-status github-sync-status"></div>
  <input id="importJsonInput" type="file" accept="application/json,.json" style="display:none" onchange="importJsonFile(this.files && this.files[0])">

  <div class="view-switch">
    <button type="button" class="view-btn" onclick="setViewMode('table')">表格</button>
    <button type="button" class="view-btn" onclick="setViewMode('card')">卡片</button>
  </div>

  <div id="tableWrap" class="table-wrap">
    <table>
      <colgroup>
        <col data-col="order"   style="width:52px">
        <col data-col="name"    style="width:80px">
        <col data-col="contact" style="width:105px">
        <col data-col="item"    style="width:90px">
        <col data-col="data"    style="width:105px">
        <col data-col="start"   style="width:130px">
        <col data-col="ddl"     style="width:130px">
        <col data-col="deposit" style="width:90px">
        <col data-col="price"   style="width:90px">
        <col data-col="pay"     style="width:105px">
        <col data-col="note"    style="width:145px">
        <col data-col="actions" style="width:110px">
      </colgroup>
      <thead>
        <tr>
          <th data-col="order"   class="col-narrow-center">順序</th>
          <th data-col="name">委託人</th>
          <th data-col="contact" class="col-contact">聯絡</th>
          <th data-col="item">項目</th>
          <th data-col="data"    class="col-data">委託資料</th>
          <th data-col="start">開工</th>
          <th data-col="ddl">DDL</th>
          <th data-col="deposit">訂金</th>
          <th data-col="price">價格</th>
          <th data-col="pay"     class="col-pay">付款狀態</th>
          <th data-col="note">備註</th>
          <th data-col="actions" class="col-narrow-center">
            <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
              <span>操作</span>

  let data = loadData();
  let sortMode = loadSortMode();

let activeMonth = ""; // 例如 "2026-01"

  function loadSortMode(){

  }

  function loadData(){

      const arr = raw ? JSON.parse(raw) : [];
      return arr.map(x => ({
        name: x.name ?? "",
        contactType: x.contactType ?? "Facebook",
        contactUrl: x.contactUrl ?? "",
        item: x.item ?? "",
        dataUrl: x.dataUrl ?? "",
        start: x.start ?? "",
        ddl: x.ddl ?? "",
        deposit: x.deposit ?? "",
        price: x.price ?? "",
        pay: x.pay ?? "未付款",
        note: x.note ?? "",

        month: x.month ?? "",
        draft: !!x.draft,
        public: x.public !== false,
        formId: x.formId ?? ""
      }));
    }catch(e){
      return [];
    }
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    backupNow(); // ✅ 每次存檔順便備份
  }
const BACKUP_KEY = STORAGE_KEY + "__backup";
const BACKUP_TS_KEY = STORAGE_KEY + "__backup_ts";

function nowTsStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function backupNow(){
  try{
    localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
    localStorage.setItem(BACKUP_TS_KEY, nowTsStr());
  }catch(e){
    console.warn("備份失敗", e);
  }
  renderBackupStatus();
}

function renderBackupStatus(){
  const el = document.getElementById("backupStatus");
  if(!el) return;
  const ts = localStorage.getItem(BACKUP_TS_KEY);
  el.innerHTML = `

    <button type="button" class="copy-btn" onclick="syncGoogleForm(this)">📥 同步 Google 表單</button>
    <button type="button" onclick="exportJson()">匯出 JSON</button>
    <button type="button" onclick="document.getElementById('importJsonInput').click()">讀取 JSON</button>
    <button type="button" class="backup-restore-btn" onclick="restoreFromBackup()">還原瀏覽器備份</button>
  `;
  renderGithubSyncStatus();
}

const GH_CONFIG_KEY = "ame_github_sync_config_v1";

function loadGithubConfig(){
  try{ return JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || "null") || {}; }
  catch{ return {}; }
}
function saveGithubConfig(cfg){
  try{ localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg)); }catch{}
}

function renderGithubSyncStatus(){
  const el = document.getElementById("githubSyncStatus");
  if(!el) return;
  const cfg = loadGithubConfig();
  const configured = !!(cfg.token && cfg.owner && cfg.repo && cfg.path);

  if(!configured){
    el.innerHTML = `
      ☁️ GitHub 同步尚未設定
      <button type="button" onclick="openGithubConfigDialog()">設定同步</button>
    `;
    return;
  }

  const pagesUrl = `https://${cfg.owner}.github.io/${cfg.repo}/${cfg.path}`;
  el.innerHTML = `
    ☁️ 同步至：${cfg.owner}/${cfg.repo}（${cfg.lastSyncedAt ? "上次同步 " + cfg.lastSyncedAt : "尚未同步過"}）
    <button type="button" class="copy-btn" id="ghSyncBtn" onclick="syncScheduleToGithub(this)">☁️ 同步排單頁</button>
    <button type="button" onclick="window.open('${pagesUrl}','_blank')">🔗 開啟網頁</button>
    <button type="button" onclick="copyTextToClipboard('${pagesUrl}', this, '已複製連結 ✅', '複製連結')">複製連結</button>
    <button type="button" onclick="openGithubConfigDialog()">重新設定</button>
  `;
}

function openGithubConfigDialog(){
  const cfg = loadGithubConfig();
  const owner = prompt("GitHub 帳號名稱（例如 yourname）：", cfg.owner || "");
  if(owner === null) return;
  const repo = prompt("Repository 名稱（例如 ame-schedule，需是 public repo 並已開啟 GitHub Pages）：", cfg.repo || "");
  if(repo === null) return;
  const path = prompt("檔案路徑（例如 schedule.html）：", cfg.path || "schedule.html");
  if(path === null) return;
  const token = prompt("GitHub Personal Access Token（只會存在你的瀏覽器，不會上傳給任何人）：", cfg.token || "");
  if(token === null) return;

  saveGithubConfig({
    owner: owner.trim(),
    repo: repo.trim(),
    path: path.trim().replace(/^\/+/, ""),
    token: token.trim(),
    lastSyncedAt: cfg.lastSyncedAt || ""
  });
  renderGithubSyncStatus();
  alert("設定已儲存 ✅\n\n下一步：請確認該 repo 是 Public，並在 repo 的 Settings → Pages 啟用 GitHub Pages（Branch 選 main / root）。\n\n設定好後按「☁️ 同步排單頁」即可。");
}

async function syncScheduleToGithub(btnEl){
  const cfg = loadGithubConfig();
  if(!cfg.token || !cfg.owner || !cfg.repo || !cfg.path){
    alert("尚未完成 GitHub 同步設定。");
    openGithubConfigDialog();
    return;
  }

  const html = buildPublicScheduleHtml();
  const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;

  const originalLabel = btnEl ? btnEl.textContent : "";
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = "同步中…"; }

  try{
    // 先查詢檔案目前的 sha（更新既有檔案必須帶 sha，新檔案則沒有）
    let sha = undefined;
    const getRes = await fetch(apiUrl, {
      headers: {
        "Authorization": `Bearer ${cfg.token}`,
        "Accept": "application/vnd.github+json"
      }
    });
    if(getRes.ok){
      const getData = await getRes.json();
      sha = getData.sha;
    }else if(getRes.status !== 404){
      const errText = await getRes.text();
      throw new Error(`讀取檔案資訊失敗（${getRes.status}）：${errText}`);
    }

    // base64 編碼（要先處理中文 UTF-8）
    const base64Content = btoa(unescape(encodeURIComponent(html)));

    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${cfg.token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `更新排單頁 ${nowTsStr()}`,
        content: base64Content,
        sha: sha
      })
    });

    if(!putRes.ok){
      const errText = await putRes.text();
      throw new Error(`同步失敗（${putRes.status}）：${errText}`);
    }

    cfg.lastSyncedAt = nowTsStr();
    saveGithubConfig(cfg);
    renderGithubSyncStatus();
    alert("同步成功 ✅\n\n注意：GitHub Pages 更新通常需要等 30 秒～幾分鐘才會生效。");
  }catch(e){
    console.error(e);
    alert("同步失敗：" + (e.message || "未知錯誤") + "\n\n請確認 Token 權限（需要 Contents 讀寫權限）與 repo/路徑名稱是否正確。");
  }finally{
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = originalLabel || "☁️ 同步排單頁"; }
  }
}

function restoreFromBackup(){
  const raw = localStorage.getItem(BACKUP_KEY);
  if(!raw) return alert("沒有找到備份。");
  if(!confirm("⚠️ 你確定要還原備份嗎？目前資料會被取代。")) return;
  try{
    data = JSON.parse(raw);
    saveData(); // 會再次備份（等於產生新的備份時間）
    (typeof safeRender === "function") ? safeRender() : render();
    alert("已還原備份 ✅");
  }catch(e){
    console.error(e);
    alert("備份格式錯誤，無法還原。");
  }
}

function downloadTextFile(filename, text){
  const blob = new Blob([text], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  };
}

function exportJson(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const stamp = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  downloadTextFile(`ame_commissions_backup_${stamp}.json`, JSON.stringify(buildJsonPayload(), null, 2));
}

function escapeForTsv(val){
  // TSV 不能有 Tab 或換行，會打斷欄位，全部換成空格
  return String(val ?? "").replace(/\t/g, " ").replace(/\r?\n/g, " ").trim();
}

function copyTableForNotion(btnEl){
  const header = ["委託人", "項目", "開工日", "DDL截稿日", "付款狀態", "備註", "完成狀態"];
  const rows = getRenderOrder().map(i => {
    const r = data[i];
    return [
      r.name,
      r.item,
      r.start,
      r.ddl,
      r.pay,
      r.note,
      r.done ? "已完成" : "進行中"
    ].map(escapeForTsv).join("\t");
  });
  const text = [header.join("\t"), ...rows].join("\n");
  copyTextToClipboard(text, btnEl, "已複製 ✅", "📋 複製表格給 Notion");
}

async function copyTextToClipboard(text, btnEl, successLabel, resetLabel){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    if(btnEl){
      const original = resetLabel || btnEl.textContent;
      btnEl.textContent = successLabel || "已複製 ✅";
      btnEl.disabled = true;
      setTimeout(()=>{ btnEl.textContent = original; btnEl.disabled = false; }, 1600);
    }
  }catch(e){
    console.error(e);
    alert("複製失敗，請改用「匯出 JSON」下載檔案後手動處理。");
  }
}


function buildPublicScheduleHtml(){
  const rows = getRenderOrder()
    .map(i => data[i])
    .filter(r => !r.done && r.public !== false);

  const generatedAt = nowTsStr();

  function publicName(name){
    const raw = String(name || "匿名委託人").trim();
    if(!raw) return "匿＊";
    const first = Array.from(raw)[0] || "匿";
    return first + "＊";
  }

  function shortDate(dateStr){
    const s = String(dateStr || "").trim();
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return s || "未定";
    return `${Number(m[2])}/${Number(m[3])}`;
  }

  function monthFromDate(dateStr){
    const s = String(dateStr || "").trim();
    const m = s.match(/^(\d{4})-(\d{2})-/);
    if(!m) return "未定";
    return `${m[1]}/${Number(m[2])}`;
  }

  function publicStatus(row){
    if(row.done) return { text:"已完成", icon:"✅", cls:"status-done" };

    const s = String(row.start || "").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){
      return { text:"排隊中", icon:"⏳", cls:"status-wait" };
    }

    const startDate = new Date(s + "T00:00:00");
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    if(startDate > today){
      return { text:"排隊中", icon:"⏳", cls:"status-wait" };
    }
    return { text:"進行中", icon:"🎨", cls:"status-progress" };
  }

  const latestDDL = rows
    .map(r => String(r.ddl || ""))
    .filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v))
    .sort()
    .at(-1);

  const scheduleUntil = latestDDL ? monthFromDate(latestDDL) : "未定";

  const tableRowsHtml = rows.length ? rows.map((r, idx) => {
    const name = publicName(r.name);
    const item = escapeHtml(r.item || "未填項目");
    const start = shortDate(r.start);
    const ddl = shortDate(r.ddl);
    const note = escapeHtml((r.note || "").trim() || "—");
    const status = publicStatus(r);

    return `
      <tr>
        <td class="queue-no"><span>#${String(idx + 1).padStart(2, "0")}</span></td>
        <td class="client-cell">
          <span class="avatar">${escapeHtml(name.slice(0, 1))}</span>
          <span class="client-name">${escapeHtml(name)}</span>
        </td>
        <td class="item-cell">${item}</td>
        <td class="date-cell"><span>${escapeHtml(start)}</span></td>
        <td class="date-cell"><span>${escapeHtml(ddl)}</span></td>
        <td class="note-cell">${note}</td>
        <td class="status-cell"><span class="status-pill ${status.cls}">${status.icon} ${status.text}</span></td>
      </tr>
    `;
  }).join("") : `
    <tr>
      <td colspan="7" class="empty-cell">
        <div class="empty-icon">☁️</div>
        <div class="empty-title">目前沒有公開排單中的委託</div>
        <div class="empty-text">等排單更新後會顯示在這裡。</div>

function downloadHtmlFile(filename, text){
  const blob = new Blob([text], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const GOOGLE_FORM_API_URL = "https://script.google.com/macros/s/AKfycbzAcu2D9LidrvM-VLGymB91ya7kaz0i8erbtpi05EFkACnmHX7qsP6vJLhKM5WCL6mqNQ/exec";

function normalizeFormId(v, fallback){
  const s = String(v ?? "").trim();
  return s || fallback;
}

function cleanSheetValue(v){
  return String(v ?? "").trim();
}

function getSheetValue(row, candidates, indexFallback){
  // Google 表單欄位有時會偷偷帶空白，例如「委託人暱稱 」
  // 所以這裡會先把 key trim 後再比對；如果還是找不到，就用欄位順序備援。
  const keys = Object.keys(row || {});
  const normalized = {};
  keys.forEach(k => { normalized[String(k).trim()] = row[k]; });

  for(const name of candidates){
    const key = String(name).trim();
    if(Object.prototype.hasOwnProperty.call(normalized, key)){
      return normalized[key];
    }
  }

  if(Number.isInteger(indexFallback) && keys[indexFallback] !== undefined){
    return row[keys[indexFallback]];
  }
  return "";
}

function makeFormSignature(timestamp, name, item, dataUrl, index){
  const base = [timestamp, name, item, dataUrl].map(v => String(v || "").trim()).join("|");
  return base || `form-row-${index}`;
}

function mapGoogleFormRow(row, index){
  const timestamp = cleanSheetValue(getSheetValue(row, ["時間戳記", "Timestamp"], 0));
  const name = cleanSheetValue(getSheetValue(row, ["委託人暱稱", "委託人", "暱稱"], 1));
  const contactRaw = cleanSheetValue(getSheetValue(row, ["聯絡方式", "聯絡平台", "聯絡方式網址或ID"], 2));
  const item = cleanSheetValue(getSheetValue(row, ["委託項目", "項目"], 3));
  const dataUrl = cleanSheetValue(getSheetValue(row, ["委託資料（角色設定）", "委託資料", "角色設定"], 4));

  return {
    name,
    contactType: contactRaw || "表單",
    contactUrl: "",
    item,
    dataUrl,
    start: "",
    ddl: "",
    deposit: "",
    price: "",
    pay: "未付款",
    note: "",
    done: false,
    month: "",
    draft: false,
    public: true,
    formId: normalizeFormId(timestamp, makeFormSignature(timestamp, name, item, dataUrl, index)),
    formSignature: makeFormSignature(timestamp, name, item, dataUrl, index)
  };
}

async function syncGoogleForm(btnEl){
  const originalLabel = btnEl ? btnEl.textContent : "";
  if(btnEl){
    btnEl.disabled = true;
    btnEl.textContent = "同步中…";
  }

  try{
    const res = await fetch(GOOGLE_FORM_API_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`Google 表單讀取失敗（${res.status}）`);

    const rows = await res.json();
    if(!Array.isArray(rows)) throw new Error("Google 表單回傳格式不是陣列。");

    const existed = new Set(data.map(r => String(r.formId || r.formSignature || "")).filter(Boolean));
    let added = 0;
    let skipped = 0;
    let invalid = 0;

    rows.forEach((row, index)=>{
      const mapped = mapGoogleFormRow(row, index);
      if(!mapped.name){
        invalid++;
        return;
      }
      const key = String(mapped.formId || mapped.formSignature || "").trim();
      if(key && existed.has(key)){
        skipped++;
        return;
      }
      data.push(mapped);
      if(key) existed.add(key);
      added++;
    });

    if(added > 0){
      saveData();
      activeMonth = loadActiveMonth();
      safeRender();
    }

    alert(`Google 表單同步完成 ✅\n新增 ${added} 筆，略過 ${skipped} 筆，無效 ${invalid} 筆。`);
  }catch(e){
    console.error(e);
    alert("同步失敗：" + (e.message || "未知錯誤") + "\n\n請確認 Apps Script 部署權限是『任何人』，並且網址是 /exec 結尾。");
  }finally{
    if(btnEl){
      btnEl.disabled = false;
      btnEl.textContent = originalLabel || "📥 同步 Google 表單";
    }
  }
}

function normalizeImportedData(payload){
  const arr = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.data) ? payload.data : null);
  if(!arr) throw new Error("JSON 裡沒有可讀取的委託清單資料。");

  return arr.map(x => ({
    name: x.name ?? "",
    contactType: x.contactType ?? "Facebook",
    contactUrl: x.contactUrl ?? "",
    item: x.item ?? "",
    dataUrl: x.dataUrl ?? "",
    start: x.start ?? "",
    ddl: x.ddl ?? "",
    deposit: x.deposit ?? "",
    price: x.price ?? "",
    pay: x.pay ?? "未付款",
    note: x.note ?? "",
    done: !!x.done,
    month: x.month ?? "",
    draft: !!x.draft,
    public: x.public !== false,
    formId: x.formId ?? ""
  }));
}

function importJsonFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const payload = JSON.parse(reader.result);
      const imported = normalizeImportedData(payload);
      if(!confirm(`讀到 ${imported.length} 筆委託。要用這份 JSON 取代目前網站內的清單嗎？\n\n建議：匯入前可先按「匯出 JSON」備份目前資料。`)) return;
      data = imported;
      saveData();
      activeMonth = loadActiveMonth();
      safeRender();
      alert("JSON 已讀取完成 ✅");
    }catch(e){
      console.error(e);
      alert("讀取失敗：這個 JSON 格式不符合委託清單資料。");
    }finally{
      const input = document.getElementById("importJsonInput");
      if(input) input.value = "";
    }
  };
  reader.readAsText(file, "utf-8");
}

  function daysLeft(ddl){
    if(!ddl) return null;
    const d = new Date(ddl + "T00:00:00");
    if(Number.isNaN(d.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = d - today;
    return Math.ceil(diff / 86400000);
  }

function moneyToNum(x){
  // 允許 "1500" / "1,500" / "1500元" 等
  const s = String(x ?? "").replace(/[^\d]/g, "");

}

function updateMonthIncome(){
  const box = document.getElementById("monthIncome");
  if(!box) return;

  const rows = data.filter(r => {
    const m = r.month || inferMonthFromRow(r);
    return m === activeMonth;
  });

  let received = 0; // 已收（已付清）
  let pending  = 0; // 待收（未付款 + 已付訂金）
  let deposit  = 0; // 訂金（已付訂金）

  rows.forEach(r=>{
    const price = moneyToNum(r.price);
    if(r.pay === "已付清"){
      received += price;
    }else if(r.pay === "已付訂金"){
      deposit += price;
      pending += price;
    }else{ // 未付款 或空白
      pending += price;
    }
  });

  box.innerHTML =
    `📘 本月已收：${received.toLocaleString()} 元　` +
    `🧾 待收：${pending.toLocaleString()} 元　` +
    `💠 訂金：${deposit.toLocaleString()} 元`;
}

function pad2(n){ return String(n).padStart(2,"0"); }

function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}


// 舊資料沒有 month 時：用 ddl 或 start 推月份；都沒有就丟到「未分類」
function inferMonthFromRow(r){
  const s = (r.start || "").trim(); // ← 只看開工日
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.slice(0,7);
  return "未分類";
}


function ensureMonthField(){
  let changed = false;
  data.forEach(r=>{
    if(!r.month){
      r.month = inferMonthFromRow(r);
      changed = true;
    }
  });
  if(changed) saveData();
}

function getAllMonths(){
  const set = new Set();
  data.forEach(r=>{
    if(r.month) set.add(r.month);
    else set.add(inferMonthFromRow(r));
  });
  // 排序：未分類放最後；其餘照時間新到舊或舊到新你可改
  const arr = Array.from(set);
  arr.sort((a,b)=>{
    if(a==="未分類") return 1;
    if(b==="未分類") return -1;
    return a.localeCompare(b); // 依字串可得到 yyyy-mm 升冪
  });
  return arr;
}

  function getRenderOrder(){
    const notDone = [];

    data.forEach((r, idx) => (r.done ? done : notDone).push(idx));

    if(sortMode === "ddl"){
      notDone.sort((ia, ib)=>{
        const a = data[ia], b = data[ib];
        const da = daysLeft(a.ddl);
        const db = daysLeft(b.ddl);
        if(da === null && db !== null) return 1;
        if(da !== null && db === null) return -1;
        if(da === null && db === null) return 0;
        return da - db;
      });

    const group = data.map((x, idx)=>({x, idx}))
      .filter(o => o.x.done === isDone)
      .map(o => o.idx);

    const pos = group.indexOf(indexInData);
    const nextPos = pos + dir;
    if(nextPos < 0 || nextPos >= group.length) return;

    const swapWith = group[nextPos];
    const tmp = data[indexInData];
    data[indexInData] = data[swapWith];
    data[swapWith] = tmp;

  if(!wrap) return;
  wrap.innerHTML = "";

  order.forEach((i)=>{
    const r = data[i];
    const dleft = daysLeft(r.ddl);
    const dText = r.done ? "X" : ((dleft === null) ? "—" : `${dleft} 天`);

    const card = document.createElement("div");
    card.className = "comm-card";

    // 套用你原本的 urgent/warning/done 規則 :contentReference[oaicite:5]{index=5}
    if(!r.done){
      const d = daysLeft(r.ddl);
      if(d !== null){
        if(d <= 3) card.classList.add("urgent");
        else if(d <= 7) card.classList.add("warning");
      }
    }
    if(r.done) card.classList.add("done");

    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${escapeHtml(r.name)}</div>
        <div class="card-pill">${escapeHtml(r.pay || "未付款")}｜${escapeHtml(dText)}</div>
      </div>

      <div class="card-row"><b>項目</b>：${escapeHtml(r.item || "—")}</div>
      <div class="card-row"><b>開工</b>：${escapeHtml(r.start || "—")}　<b>DDL</b>：${escapeHtml(r.ddl || "—")}</div>
      <div class="card-row"><b>訂金</b>：${escapeHtml(r.deposit || "—")}　<b>價格</b>：${escapeHtml(r.price || "—")}</div>
      <div class="card-row"><b>備註</b>：${escapeHtml(r.note || "—")}</div>

      <div class="card-row" style="margin-top:10px; gap:10px;">
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" ${r.draft ? "checked":""} onchange="toggleDraft(${i})">草稿
        </label>
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" ${r.done ? "checked":""} onchange="toggleDone(${i})">完成
        </label>
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" ${r.public !== false ? "checked":""} onchange="togglePublic(${i})">公開
        </label>
        <button class="btn-icon" type="button" onclick="removeRow(${i})">刪除</button>
      </div>
    `;
    wrap.appendChild(card);
  });
}

function togglePublic(i){
  data[i].public = !(data[i].public !== false);
  saveData();
  safeRender();
}

function toggleDraft(i){
  data[i].draft = !data[i].draft;
  saveData();
  safeRender();
}

function safeRender(){
  try{
    render();
    updateMonthIncome?.();
  }catch(e){
    console.error(e);
    const box = document.getElementById("monthIncome");
    if(box) box.innerHTML = `⚠️ 程式錯誤：${String(e).slice(0,120)}`;
    alert("委託清單程式有錯誤（資料還在），請開 F12 → Console 看錯誤訊息。");
  }
}

/* ── 欄位顯示/隱藏 ── */
const COL_PREFS_KEY = 'ame_col_prefs_v1';
// 預設全部顯示
const COL_DEFAULTS = {contact:true,data:true,start:true,days:true,deposit:true,price:true,pay:true,note:true};

function loadColPrefs(){
  try{ return Object.assign({}, COL_DEFAULTS, JSON.parse(localStorage.getItem(COL_PREFS_KEY)||'{}')); }
  catch{ return {...COL_DEFAULTS}; }
}
function saveColPrefs(prefs){
  try{ localStorage.setItem(COL_PREFS_KEY, JSON.stringify(prefs)); }catch{}
}

function applyColVisibility(){
  const prefs = loadColPrefs();
  // 更新 col/th/td 的 hidden 狀態
  document.querySelectorAll('[data-col]').forEach(el=>{
    const col = el.getAttribute('data-col');
    if(col in prefs){
      el.classList.toggle('col-hidden', !prefs[col]);
    }
  });
  // 同步 panel 裡的 checkbox 狀態
  document.querySelectorAll('#colTogglePanel input[data-col]').forEach(cb=>{
    cb.checked = prefs[cb.getAttribute('data-col')] !== false;
  });
}

function initColToggle(){
  const btn   = document.getElementById('colToggleBtn');
  const panel = document.getElementById('colTogglePanel');
  if(!btn || !panel) return;

  // 開關面板
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.toggle('open');
  });

  // 點外面關掉
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });

  // checkbox 變更
  panel.querySelectorAll('input[data-col]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const prefs = loadColPrefs();
      prefs[cb.getAttribute('data-col')] = cb.checked;
      saveColPrefs(prefs);
      applyColVisibility();
    });
  });

  applyColVisibility();
}

  activeMonth = loadActiveMonth();
  toggleContactCustom();
  safeRender();
  initColToggle();

</script>
