<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>阿梅委託管理清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --border:#e5e7eb;
    --text:rgba(0,0,0,.78);
    --muted:rgba(0,0,0,.48);
    --accent:rgb(110,180,135);
    --accentSoft:rgba(110,180,135,.12);
    --purple:rgb(167,142,220);
    --purpleSoft:rgba(167,142,220,.16);
    --danger:rgb(164,43,57);
    --warning:rgb(231,179,34);
    --shadow-sm:0 10px 28px rgba(0,0,0,.08);
    --radius:16px;
    --form-gap:12px;
    --cell-pad:8px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:24px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }

  h1{
    margin:0 0 16px;
    font-size:20px;
    font-weight:950;
    letter-spacing:.2px;
  }

  a{
    color:var(--accent);
    text-decoration:none;
    font-weight:800;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    padding:16px;
    margin-bottom:20px;
  }

  /* ===== Form groups ===== */
  .form-groups{
    display:grid;
    gap:12px;
  }

  .form-group{
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    background:rgba(255,255,255,.72);
  }

  .form-group legend{
    padding:0 6px;
    color:rgba(0,0,0,.62);
    font-size:12px;
    font-weight:950;
  }

  .form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:var(--form-gap);
  }

  .form label{
    display:flex;
    flex-direction:column;
    gap:6px;
    color:rgba(0,0,0,.58);
    font-size:12px;
    font-weight:800;
  }

  input, select{
    width:100%;
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    color:var(--text);
    font-size:13px;
  }

  input:focus, select:focus{
    outline:none;
    border-color:rgba(110,180,135,.55);
    box-shadow:0 0 0 4px rgba(110,180,135,.14);
  }

  .row-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:12px;
  }

  button{
    border:none;
    border-radius:999px;
    padding:10px 14px;
    background:var(--accent);
    color:#fff;
    font-weight:900;
    cursor:pointer;
    transition:background .15s ease, transform .08s ease, border-color .15s ease;
  }

  button:hover{ transform:translateY(-1px); }

  button.secondary,
  .btn-icon,
  .btn-mini,
  .contact-edit,
  .backup-status button{
    border:1px solid var(--border);
    background:#fff;
    color:rgba(0,0,0,.72);
  }

  .hint{
    color:var(--muted);
    font-size:12px;
  }

  /* ===== Month / backup controls ===== */
  .month-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 12px;
  }

  .month-tab{
    border:1px solid var(--border);
    background:#fff;
    color:rgba(0,0,0,.70);
    padding:8px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
  }

  .month-tab:hover{ background:#f7f7f7; }

  .month-tab.active{
    border-color:rgba(110,180,135,.55);
    background:var(--accentSoft);
  }

  .month-income,
  .backup-status{
    display:inline-flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin:10px 8px 14px 0;
    padding:9px 12px;
    border-radius:12px;
    font-size:12px;
    font-weight:900;
  }

  .month-income{
    background:var(--accentSoft);
    border:1px solid rgba(110,180,135,.30);
    color:rgba(0,0,0,.75);
  }

  .backup-status{
    background:var(--purpleSoft);
    border:1px solid rgba(167,142,220,.28);
    color:rgba(0,0,0,.70);
  }

  .backup-status button{
    padding:4px 8px;
    border-radius:10px;
    font-size:12px;
  }

  .backup-status button:hover{ background:#f7f7f7; }

  .backup-restore-btn{
    background:rgba(164,43,57,.12) !important;
    border-color:rgba(164,43,57,.35) !important;
    color:var(--danger) !important;
  }

  /* ===== Table ===== */
  .table-wrap{
    overflow:auto;
    border:1px solid var(--border);
    border-radius:14px;
  }

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
    font-size:12px;
  }

  th, td{
    padding:var(--cell-pad);
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:middle;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  th{
    position:sticky;
    top:0;
    z-index:1;
    background:#fafafa;
    color:rgba(0,0,0,.66);
    font-weight:950;
  }

  td.td-wide, th.td-wide{ white-space:normal; }
  .col-narrow-center, td.col-narrow-center{ text-align:center; }
  .col-days{ text-align:center; }
  td.col-pay{ overflow:hidden; }

  #list tr:hover{ background:var(--purpleSoft) !important; }

  tr.urgent{ background:rgba(220,38,38,.06); }
  tr.warning{ background:rgba(234,179,8,.08); }
  tr.done{
    color:#aaa;
    background:#fcfcfc;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 8px;
    border:1px solid rgba(110,180,135,.18);
    border-radius:999px;
    background:var(--accentSoft);
    color:#1f6b41;
    font-size:11px;
    font-weight:900;
  }

  .tbl-input{
    width:50px;
    max-width:50px;
    padding:6px 8px;
    font-size:12px;
  }

  input[type="date"].tbl-input{
    width:100px !important;
    max-width:100px !important;
  }

  .tbl-note{
    width:125px;
    max-width:125px;
    padding:6px 8px;
    font-size:12px;
  }

  .linkrow{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }

  .linkrow-contact{
    display:flex;
    align-items:center;
    flex-wrap:nowrap !important;
    gap:6px;
  }

  .linkrow-contact a,
  .linkrow-contact span{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .linkrow-contact button{ flex:0 0 auto; }

  .contact-edit{
    border-radius:6px;
    padding:2px 6px;
    color:var(--purple) !important;
    font-size:12px;
  }

  .contact-edit:hover{
    background:var(--purpleSoft);
    border-color:rgba(167,142,220,.45);
  }

  .btn-icon{
    border-radius:12px;
    padding:8px 10px;
    font-size:12px;
  }

  .btn-icon:hover{ background:#fafafa; }

  .btn-order{
    width:28px;
    height:28px;
    padding:0;
    border:1px solid rgba(167,142,220,.45);
    border-radius:50%;
    background:#fff !important;
    color:var(--purple) !important;
    line-height:26px;
    text-align:center;
    font-size:11px;
  }

  .btn-order:hover{
    background:var(--purpleSoft) !important;
    border-color:rgba(167,142,220,.65);
  }

  .col-pay select{
    width:100% !important;
    max-width:100% !important;
    box-sizing:border-box;
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding:4px 22px 4px 8px;
    border:1px solid transparent;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    background-repeat:no-repeat;
    background-image:
      linear-gradient(45deg, transparent 50%, rgba(0,0,0,.45) 50%),
      linear-gradient(135deg, rgba(0,0,0,.45) 50%, transparent 50%);
    background-position:right 12px center, right 7px center;
    background-size:6px 6px, 6px 6px;
  }

  .pay-unpaid{
    background-color:rgba(220,38,38,.12);
    border-color:rgba(220,38,38,.25);
    color:rgb(153,27,27);
  }

  .pay-deposit{
    background-color:rgba(37,99,235,.12);
    border-color:rgba(37,99,235,.25);
    color:rgb(29,78,216);
  }

  .pay-paid{
    background-color:rgba(22,163,74,.12);
    border-color:rgba(22,163,74,.25);
    color:rgb(21,128,61);
  }

  tr.done .pill,
  tr.done .col-pay select,
  tr.done .col-pay select.pay-unpaid,
  tr.done .col-pay select.pay-deposit,
  tr.done .col-pay select.pay-paid{
    background-color:#f2f3f4 !important;
    border-color:#dedfe2 !important;
    color:#9aa0a6 !important;
  }

  tr.done button{
    background:#f2f3f4 !important;
    border-color:#dedfe2 !important;
    color:#9aa0a6 !important;
    box-shadow:none !important;
  }

  tr.done a{ color:#9aa0a6 !important; }

  tr.done input{
    background:#fafafa;
    border-color:#e6e6e6;
    color:#9aa0a6;
  }

  /* ===== Card view ===== */
  .card-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:12px;
    margin-top:12px;
  }

  #cardList .card{
    margin-bottom:0;
    padding:12px;
    border-color:rgba(0,0,0,.08);
    border-radius:14px;
    background:rgba(255,255,255,.85);
    box-shadow:0 8px 18px rgba(0,0,0,.06);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }

  #cardList .card:hover{
    background:rgba(255,255,255,.9);
    border-color:rgba(167,142,220,.7);
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    transform:translateY(-4px);
  }

  .card-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }

  .card-name{
    color:var(--purple);
    font-size:18px;
    font-weight:950;
    letter-spacing:.5px;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }

  .card-pill{
    margin-left:auto;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(0,0,0,.06);
    font-size:12px;
    font-weight:900;
  }

  .card-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    color:rgba(0,0,0,.72);
    font-size:13px;
  }

  .card-row b{ color:rgba(0,0,0,.9); }

  #cardList .card.urgent{
    border-color:rgba(164,43,57,.35);
    background:rgba(164,43,57,.06);
  }

  #cardList .card.warning{
    border-color:rgba(231,179,34,.35);
    background:rgba(231,179,34,.08);
  }

  #cardList .card.done{
    opacity:.6;
    filter:grayscale(.2);
  }

  .view-switch{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:0 10px;
  }

  .view-btn{
    border:1px solid rgba(0,0,0,.12);
    border-radius:999px;
    background:rgba(255,255,255,.8);
    color:#222;
    padding:5px 12px;
    font-size:12px;
    font-weight:900;
  }

  .view-btn:hover{
    background:var(--purpleSoft);
    border-color:rgba(167,142,220,.6);
  }

  .view-btn.active{
    background:rgba(167,142,220,.35);
    border-color:rgba(167,142,220,.8);
  }
</style>
</head>
<body>

<h1>阿梅委託管理清單</h1>

<div class="card">
  <div class="form-groups">
    <fieldset class="form-group">
      <legend>基本資料</legend>
      <div class="form">
        <label>委託人暱稱
          <input id="name" placeholder="例如：阿花/匿名A">
        </label>

        <label>委託項目
          <input id="item" list="itemOptions" placeholder="可選或自行輸入">
          <datalist id="itemOptions">
            <option value="大頭"></option>
            <option value="半身"></option>
            <option value="立繪"></option>
            <option value="組合頁A"></option>
            <option value="組合頁B"></option>
            <option value="性轉組合頁"></option>
            <option value="迷你Q"></option>
          </datalist>
        </label>

        <label>月份
          <select id="month"></select>
        </label>
      </div>
    </fieldset>

    <fieldset class="form-group">
      <legend>聯絡與資料</legend>
      <div class="form">
        <label>聯絡方式
          <select id="contactType" onchange="toggleContactCustom()">
            <option>Facebook</option>
            <option>Plurk</option>
            <option>Threads</option>
            <option>Discord</option>
            <option value="自訂">自訂</option>
          </select>
        </label>

        <label id="contactCustomLabel" style="display:none;">自訂聯絡方式
          <input id="contactCustom" placeholder="例如：X / IG / E-mail">
        </label>

        <label>聯絡方式網址 / ID
          <input id="contactUrl" placeholder="網址、帳號、ID 都可以">
        </label>

        <label>委託資料（網址）
          <input id="dataUrl" placeholder="https://...">
        </label>
      </div>
    </fieldset>

    <fieldset class="form-group">
      <legend>日期與金額</legend>
      <div class="form">
        <label>開工日（可不填）
          <input type="date" id="start">
        </label>

        <label>DDL（建議必填）
          <input type="date" id="ddl">
        </label>

        <label>訂金（可不填）
          <input id="deposit" placeholder="例如：500">
        </label>

        <label>價格
          <input id="price" placeholder="例如：1500">
        </label>

        <label>付款狀態
          <select id="pay">
            <option>未付款</option>
            <option>已付訂金</option>
            <option>已付清</option>
          </select>
        </label>
      </div>
    </fieldset>
  </div>

  <div class="row-actions">
    <button type="button" onclick="addRow()">新增委託</button>
<button type="button" class="secondary" onclick="toggleSortMode()">切換排序</button>
<span id="sortModeBadge" class="hint"
  style="padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:#fff;">
  依 DDL 自動排序
</span>
  </div>
</div>

<div class="card">
  <div id="tableWrap" class="table-wrap">
  <div id="monthTabs" class="month-tabs"></div>
    <table>
      <colgroup>
        <col style="width:70px">   <!-- 順序 -->
        <col style="width:70px">  <!-- 委託人 -->
        <col style="width:120px">   <!-- 聯絡 -->
        <col style="width:110px">  <!-- 項目 -->
        <col style="width:140px">  <!-- 委託資料 -->
        <col style="width:130px">  <!-- 開工 -->
        <col style="width:130px">  <!-- DDL -->
        <col style="width:90px">   <!-- 倒數 (窄) -->
        <col style="width:80px">   <!-- 訂金 -->
        <col style="width:90px">   <!-- 價格 -->
        <col style="width:100px">  <!-- 付款狀態 -->
        <col style="width:160px">  <!-- 備註  -->
        <col style="width:70px">   <!-- 草稿 (窄) -->
        <col style="width:70px">   <!-- 完成 (窄) -->
        <col style="width:80px">   <!-- 刪除 (窄) -->
      </colgroup>
      <thead>
        <tr>
          <th class="col-narrow-center">順序</th>
          <th>委託人</th>
          <th class="col-contact">聯絡</th>
          <th>項目</th>
          <th class="col-data">委託資料</th>
          <th>開工</th>
          <th>DDL</th>
          <th class="col-days">倒數</th>
          <th>訂金</th>
          <th>價格</th>
          <th class="col-pay">付款狀態</th>
          <th>備註</th>
          <th class="col-narrow-center">草稿</th>
          <th class="col-narrow-center">完成</th>
          <th class="col-narrow-center">刪除</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
<div id="cardList" class="card-list" style="display:none;"></div>
<div id="monthIncome" class="month-income"></div>
<div id="backupStatus" class="backup-status"></div>
<input id="importJsonInput" type="file" accept="application/json,.json" style="display:none" onchange="importJsonFile(this.files && this.files[0])">
<div class="view-switch">
  <button type="button" class="view-btn" onclick="setViewMode('table')">表格</button>
  <button type="button" class="view-btn" onclick="setViewMode('card')">卡片</button>
</div>
</div>

<script>
  const STORAGE_KEY = "ame_commissions";
  const VIEWMODE_KEY = STORAGE_KEY + "__view_mode"; // "table" | "card"
let viewMode = (localStorage.getItem(VIEWMODE_KEY) || "table");

  function setViewMode(m){
    viewMode = m;
    try{ localStorage.setItem(VIEWMODE_KEY, m); }catch(e){}
    safeRender();
  }

  function updateViewButtons(){
    document.querySelectorAll(".view-btn").forEach(btn=>{
      btn.classList.toggle("active",
        (btn.textContent.trim() === "表格" && viewMode === "table") ||
        (btn.textContent.trim() === "卡片" && viewMode === "card")
      );
    });
  }
  const SORTMODE_KEY = "ame_commissions_sort_mode"; // "ddl" | "manual"

  let data = loadData();
  let sortMode = loadSortMode();
  const KEY_ACTIVE_MONTH = "ame_commission_active_month";
let activeMonth = ""; // 例如 "2026-01"

  function loadSortMode(){
    try{ return localStorage.getItem(SORTMODE_KEY) || "ddl"; }
    catch(e){ return "ddl"; }
  }
  function saveSortMode(){
    try{ localStorage.setItem(SORTMODE_KEY, sortMode); }catch(e){}
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return arr.map(x => ({
        name: x.name ?? "",
        contactType: x.contactType ?? "Facebook",
        contactUrl: x.contactUrl ?? "",
        item: x.item ?? "",
        dataUrl: x.dataUrl ?? "",
        start: x.start ?? "",
        ddl: x.ddl ?? "",
        deposit: x.deposit ?? "",
        price: x.price ?? "",
        pay: x.pay ?? "未付款",
        note: x.note ?? "",
        done: !!x.done,
        month: x.month ?? "",
        draft: !!x.draft
      }));
    }catch(e){
      return [];
    }
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    backupNow(); // ✅ 每次存檔順便備份
  }
const BACKUP_KEY = STORAGE_KEY + "__backup";
const BACKUP_TS_KEY = STORAGE_KEY + "__backup_ts";

function nowTsStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function backupNow(){
  try{
    localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
    localStorage.setItem(BACKUP_TS_KEY, nowTsStr());
  }catch(e){
    console.warn("備份失敗", e);
  }
  renderBackupStatus();
}

function renderBackupStatus(){
  const el = document.getElementById("backupStatus");
  if(!el) return;
  const ts = localStorage.getItem(BACKUP_TS_KEY);
  el.innerHTML = `
    💾 自動備份：${ts ? ts : "尚未備份"}
    <button type="button" onclick="exportJson()">匯出 JSON</button>
    <button type="button" onclick="document.getElementById('importJsonInput').click()">讀取 JSON</button>
    <button type="button" class="backup-restore-btn" onclick="restoreFromBackup()">還原瀏覽器備份</button>
  `;
}

function restoreFromBackup(){
  const raw = localStorage.getItem(BACKUP_KEY);
  if(!raw) return alert("沒有找到備份。");
  if(!confirm("⚠️ 你確定要還原備份嗎？目前資料會被取代。")) return;
  try{
    data = JSON.parse(raw);
    saveData(); // 會再次備份（等於產生新的備份時間）
    (typeof safeRender === "function") ? safeRender() : render();
    alert("已還原備份 ✅");
  }catch(e){
    console.error(e);
    alert("備份格式錯誤，無法還原。");
  }
}

function downloadTextFile(filename, text){
  const blob = new Blob([text], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportJson(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const stamp = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  const payload = {
    app: "阿梅委託管理清單",
    version: 1,
    exportedAt: d.toISOString(),
    data: data
  };
  downloadTextFile(`ame_commissions_backup_${stamp}.json`, JSON.stringify(payload, null, 2));
}

function normalizeImportedData(payload){
  const arr = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.data) ? payload.data : null);
  if(!arr) throw new Error("JSON 裡沒有可讀取的委託清單資料。");

  return arr.map(x => ({
    name: x.name ?? "",
    contactType: x.contactType ?? "Facebook",
    contactUrl: x.contactUrl ?? "",
    item: x.item ?? "",
    dataUrl: x.dataUrl ?? "",
    start: x.start ?? "",
    ddl: x.ddl ?? "",
    deposit: x.deposit ?? "",
    price: x.price ?? "",
    pay: x.pay ?? "未付款",
    note: x.note ?? "",
    done: !!x.done,
    month: x.month ?? "",
    draft: !!x.draft
  }));
}

function importJsonFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const payload = JSON.parse(reader.result);
      const imported = normalizeImportedData(payload);
      if(!confirm(`讀到 ${imported.length} 筆委託。要用這份 JSON 取代目前網站內的清單嗎？\n\n建議：匯入前可先按「匯出 JSON」備份目前資料。`)) return;
      data = imported;
      saveData();
      activeMonth = loadActiveMonth();
      safeRender();
      alert("JSON 已讀取完成 ✅");
    }catch(e){
      console.error(e);
      alert("讀取失敗：這個 JSON 格式不符合委託清單資料。");
    }finally{
      const input = document.getElementById("importJsonInput");
      if(input) input.value = "";
    }
  };
  reader.readAsText(file, "utf-8");
}

  function daysLeft(ddl){
    if(!ddl) return null;
    const d = new Date(ddl + "T00:00:00");
    if(Number.isNaN(d.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = d - today;
    return Math.ceil(diff / 86400000);
  }

  function payOptions(current){
    const opts = ["未付款","已付訂金","已付清"];
    return opts.map(o => `<option ${o===current?"selected":""}>${o}</option>`).join("");
  }
  function payClass(pay){
    if(pay === "未付款") return "pay-unpaid";
    if(pay === "已付訂金") return "pay-deposit";
    if(pay === "已付清") return "pay-paid";
    return "";
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(s){ return escapeHtml(s).replaceAll("`","&#096;"); }
  // === 月收入 ===
function moneyToNum(x){
  // 允許 "1500" / "1,500" / "1500元" 等
  const s = String(x ?? "").replace(/[^\d]/g, "");
  return Number(s) || 0;
}

function updateMonthIncome(){
  const box = document.getElementById("monthIncome");
  if(!box) return;

  const rows = data.filter(r => {
    const m = r.month || inferMonthFromRow(r);
    return m === activeMonth;
  });

  let received = 0; // 已收（已付清）
  let pending  = 0; // 待收（未付款 + 已付訂金）
  let deposit  = 0; // 訂金（已付訂金）

  rows.forEach(r=>{
    const price = moneyToNum(r.price);
    if(r.pay === "已付清"){
      received += price;
    }else if(r.pay === "已付訂金"){
      deposit += price;
      pending += price;
    }else{ // 未付款 或空白
      pending += price;
    }
  });

  box.innerHTML =
    `📘 本月已收：${received.toLocaleString()} 元　` +
    `🧾 待收：${pending.toLocaleString()} 元　` +
    `💠 訂金：${deposit.toLocaleString()} 元`;
}

function pad2(n){ return String(n).padStart(2,"0"); }

function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}


// 舊資料沒有 month 時：用 ddl 或 start 推月份；都沒有就丟到「未分類」
function inferMonthFromRow(r){
  const s = (r.start || "").trim(); // ← 只看開工日
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.slice(0,7);
  return "未分類";
}


function ensureMonthField(){
  let changed = false;
  data.forEach(r=>{
    if(!r.month){
      r.month = inferMonthFromRow(r);
      changed = true;
    }
  });
  if(changed) saveData();
}

function getAllMonths(){
  const set = new Set();
  data.forEach(r=>{
    if(r.month) set.add(r.month);
    else set.add(inferMonthFromRow(r));
  });
  // 排序：未分類放最後；其餘照時間新到舊或舊到新你可改
  const arr = Array.from(set);
  arr.sort((a,b)=>{
    if(a==="未分類") return 1;
    if(b==="未分類") return -1;
    return a.localeCompare(b); // 依字串可得到 yyyy-mm 升冪
  });
  return arr;
}

function loadActiveMonth(){
  const saved = localStorage.getItem(KEY_ACTIVE_MONTH);
  if(saved) return saved;
  return currentMonthStr();
}
function setActiveMonth(m){
  activeMonth = m;
  localStorage.setItem(KEY_ACTIVE_MONTH, m);
  render();
  updateMonthIncome();   // ✅ 切換當下立刻算一次（不靠刷新）
}

function renderMonthTabs(){
  const wrap = document.getElementById("monthTabs");
  if(!wrap) return;
  wrap.innerHTML = "";

  const months = getAllMonths();
  if(!months.includes(activeMonth)) {
    // 如果目前頁籤不存在（例如第一次開），就跳到第一個月或當月
    activeMonth = months.includes(currentMonthStr()) ? currentMonthStr() : (months[0] || currentMonthStr());
    localStorage.setItem(KEY_ACTIVE_MONTH, activeMonth);
updateMonthIncome();

  }

  months.forEach(m=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "month-tab" + (m===activeMonth ? " active" : "");
    btn.textContent = m;
    btn.onclick = ()=> setActiveMonth(m);
    wrap.appendChild(btn);
  });
}

}

  function toggleSortMode(){
    sortMode = (sortMode === "ddl") ? "manual" : "ddl";

  }

  function getRenderOrder(){
    const notDone = [];
    const done = [];
    data.forEach((r, idx) => (r.done ? done : notDone).push(idx));

    if(sortMode === "ddl"){
      notDone.sort((ia, ib)=>{
        const a = data[ia], b = data[ib];
        const da = daysLeft(a.ddl);
        const db = daysLeft(b.ddl);
        if(da === null && db !== null) return 1;
        if(da !== null && db === null) return -1;
        if(da === null && db === null) return 0;
        return da - db;
      });
    }
    return notDone.concat(done);
  }

  function moveRow(indexInData, dir){
    if(sortMode !== "manual") return;

    const isDone = data[indexInData].done;
    const group = data.map((x, idx)=>({x, idx}))
      .filter(o => o.x.done === isDone)
      .map(o => o.idx);

    const pos = group.indexOf(indexInData);
    const nextPos = pos + dir;
    if(nextPos < 0 || nextPos >= group.length) return;

    const swapWith = group[nextPos];
    const tmp = data[indexInData];
    data[indexInData] = data[swapWith];
    data[swapWith] = tmp;

    saveData();
    render();
  }
