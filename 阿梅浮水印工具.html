<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>阿梅｜素材浮水印工作室</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--border:#e5e7eb;--text:#202124;--muted:#6b7280;--accent:#7c5ce7;--accent-soft:#f1edff;--shadow:0 8px 28px #17203312}
*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}.app{max-width:1440px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#8b6cf0,#5840bd);color:white;display:grid;place-items:center;font-size:20px;font-weight:900}.brand h1{font-size:19px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.work{padding:16px}.side{padding:14px;display:grid;gap:12px}.toolbar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:12px}.title{font-weight:800;font-size:14px}.subtle{color:var(--muted);font-size:12px}.canvas-wrap{min-height:420px;display:grid;place-items:center;padding:16px;border-radius:14px;background-color:#f8f8fa;background-image:linear-gradient(45deg,#ececf0 25%,transparent 25%),linear-gradient(-45deg,#ececf0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ececf0 75%),linear-gradient(-45deg,transparent 75%,#ececf0 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;overflow:auto}canvas{display:block;width:auto;max-width:100%;max-height:72vh;height:auto;background:#fff;box-shadow:0 6px 22px #1112;touch-action:none;border-radius:3px}.status{min-height:20px;margin-top:9px;color:var(--muted);font-size:12px}.box{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff}.box h2{font-size:13px;margin:0 0 10px}.btn{font:inherit;border:1px solid var(--border);background:white;color:var(--text);padding:8px 11px;border-radius:10px;cursor:pointer;transition:.15s}.btn:hover{background:#f7f7f9;border-color:#cfd1d8}.btn.primary{background:#242329;color:white;border-color:#242329}.btn.primary:hover{background:#000}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#b42318;background:#fff;border-color:#ffd1cc}.btn.small{padding:6px 9px;font-size:12px}.file{width:100%;font-size:12px;padding:8px;border:1px dashed #cfd1d8;border-radius:10px;background:#fafafa}.images,.library,.layers{display:grid;gap:7px;margin-top:9px}.image-row,.asset-row,.layer-row{display:flex;align-items:center;gap:7px}.image-row button:first-child,.asset-row button:first-child,.layer-row button:first-child{flex:1;min-width:0;text-align:left}.image-row.active button:first-child{background:#242329;color:white;border-color:#242329}.thumb{width:34px;height:30px;object-fit:cover;vertical-align:middle;margin-right:7px;border-radius:5px;background:#eee}.list-empty{border:1px dashed var(--border);color:var(--muted);padding:10px;border-radius:10px;text-align:center;font-size:12px}.layer-row.selected button:first-child{border-color:#b7a7fa;background:var(--accent-soft);color:#543bb5}.editor{border:1px solid #d8cffb;background:#fbfaff;border-radius:12px;padding:11px;margin-top:10px}.editor[hidden]{display:none}.field{display:grid;grid-template-columns:95px 1fr;gap:8px;align-items:center;margin:8px 0}.field label{color:var(--muted);font-size:12px}input[type=range]{width:100%}input[type=text],select,textarea,input[type=number]{font:inherit;border:1px solid var(--border);border-radius:9px;padding:8px 9px;background:#fff;min-width:0;width:100%}input[type=color]{width:38px;height:32px;border:1px solid var(--border);border-radius:8px;padding:2px;background:#fff}textarea{resize:vertical;min-height:62px}.asset-row img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:#f1f1f4;margin-right:7px;vertical-align:middle}.asset-row .type{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;background:var(--accent-soft);color:#6547c8;margin-right:7px}.hint{font-size:11px;color:var(--muted);margin-top:6px}.output{display:grid;gap:8px}.output .btn{width:100%}.compression{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.row input[type=text]{flex:1}.badge{font-size:11px;color:#6547c8;background:var(--accent-soft);padding:3px 8px;border-radius:999px}@media(max-width:950px){body{padding:12px}.layout{grid-template-columns:1fr}.side{order:2}.canvas-wrap{min-height:300px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">A</div><div><h1>素材浮水印工作室</h1><p>像編排畫布一樣加入圖像與文字，拖曳定位並重複使用</p></div></div><span class="badge">自由圖層</span></header>
<main class="layout">
<section class="panel work">
  <div class="toolbar"><div class="title">畫布 <span id="activeImageLabel" class="subtle">尚未選擇原圖</span></div><div class="row"><button id="addText" class="btn small accent">＋ 文字</button><button id="addImage" class="btn small">＋ 上傳圖片</button><input id="assetFiles" type="file" accept="image/*" multiple hidden></div></div>
  <div class="canvas-wrap"><canvas id="canvas" width="1200" height="800"></canvas></div><div id="status" class="status"></div>
</section>
<aside class="panel side">
  <section class="box"><h2>原圖</h2><input id="baseFiles" class="file" type="file" accept="image/*" multiple><div id="images" class="images"><div class="list-empty">上傳一張或多張原圖</div></div><div class="row" style="margin-top:8px"><button id="clearImages" class="btn small danger">清空原圖</button></div></section>
  <section class="box"><h2>我的素材</h2><div class="row"><input id="assetName" type="text" placeholder="選取圖層後輸入素材名稱"><button id="saveAsset" class="btn small accent">儲存</button></div><div id="library" class="library"><div class="list-empty">選取圖層後可儲存，之後重複使用</div></div></section>
  <section class="box"><h2>圖層 <span id="layerCount" class="subtle"></span></h2><div id="layers" class="layers"><div class="list-empty">新增文字或圖片開始編排</div></div>
    <div id="editor" class="editor" hidden>
      <div class="field"><label id="contentLabel">文字內容</label><textarea id="textContent" placeholder="輸入文字，可換行"></textarea></div>
      <div class="field"><label>九宮格位置</label><select id="grid"><option value="TL">左上</option><option value="TC">上中</option><option value="TR">右上</option><option value="CL">左中</option><option value="CC">正中</option><option value="CR">右中</option><option value="BL">左下</option><option value="BC">下中</option><option value="BR">右下</option><option value="MANUAL">手動拖曳</option></select></div>
      <div class="field"><label>邊距</label><input id="margin" type="range" min="0" max="15" value="3"><span id="marginLabel" class="subtle">3%</span></div>
      <div class="field"><label>大小</label><input id="size" type="range" min="1" max="80" value="24"></div>
      <div class="field"><label>透明度</label><input id="opacity" type="range" min="0" max="100" value="100"></div>
      <div class="field text-only"><label>文字顏色</label><input id="textColor" type="color" value="#ffffff"></div>
      <div class="field text-only"><label>字型</label><select id="font"><option value="Arial,sans-serif">Arial</option><option value="'PingFang TC','Microsoft JhengHei',sans-serif">黑體（中文）</option><option value="Georgia,serif">Georgia</option><option value="'Courier New',monospace">Courier New</option></select></div>
      <div class="row" style="margin-top:10px"><button id="duplicate" class="btn small">複製</button><button id="raise" class="btn small">移到最上層</button><button id="delete" class="btn small danger">刪除</button></div>
      <div class="hint">位置按原圖個別記住。可在畫布上拖曳移動，拖曳右下角控制點可縮放圖片。</div>
    </div>
  </section>
  <section class="box output"><h2>匯出</h2><button id="downloadOne" class="btn primary">下載目前原圖</button><button id="downloadAll" class="btn">批次下載所有原圖</button><label class="compression"><input id="compress" type="checkbox" checked> 自動壓縮至 <input id="maxMB" type="number" min="0.5" step="0.5" value="5" style="width:68px"> MB 以內</label><button id="resetPositions" class="btn small">重設目前原圖的位置</button></section>
</aside>
</main>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');
const STORE_KEY='ame_reusable_canvas_assets_v1';
let baseItems=[],activeIndex=-1,elements=[],selectedId=null,pointer=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>globalThis.crypto?.randomUUID?.()||`layer_${Date.now()}_${Math.random().toString(16).slice(2)}`;
function status(s){$('status').textContent=s||'';}
function readAssets(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch{return []}}
function writeAssets(a){try{localStorage.setItem(STORE_KEY,JSON.stringify(a));return true}catch{status('素材儲存失敗：瀏覽器空間不足，請改用較小的圖片。');return false}}
function imageFromFile(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('圖片載入失敗'))};img.src=u})}
function imageFromData(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('素材載入失敗'));img.src=src})}
function imageData(img){const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/png')}
function activeItem(){return activeIndex>=0?baseItems[activeIndex]:null}
function getSelected(){return elements.find(e=>e.id===selectedId)||null}
function getPosition(el,item=activeItem()){
  const s=item?.positions?.[el.id]||{};
  return{grid:s.grid||el.grid||'CC',marginPct:Number.isFinite(s.marginPct)?s.marginPct:(el.marginPct??3),manual:!!s.manual,xPct:Number.isFinite(s.xPct)?s.xPct:(el.xPct??35),yPct:Number.isFinite(s.yPct)?s.yPct:(el.yPct??40)};
}
function savePosition(el,s,item=activeItem()){if(!item){el.grid=s.grid||el.grid||'CC';el.marginPct=s.marginPct??el.marginPct??3;el.manual=!!s.manual;el.xPct=s.xPct??el.xPct??35;el.yPct=s.yPct??el.yPct??40;return}item.positions ||= {};item.positions[el.id]={...s};}
function bounds(el,w=canvas.width,h=canvas.height,item=activeItem(),measure=ctx){
 const p=getPosition(el,item);let width,height,fontSize;
 if(el.type==='image'){width=(Number(el.widthPct)||24)*w/100;height=width*(el.img?.height||1)/(el.img?.width||1)}
 else{fontSize=Math.max(8,(Number(el.sizePct)||4)*w/100);const old=measure.font;measure.font=`${fontSize}px ${el.font||'Arial,sans-serif'}`;const lines=String(el.text||'').split('\n');width=Math.max(fontSize,...lines.map(x=>measure.measureText(x||' ').width));height=fontSize*1.28*lines.length;measure.font=old}
 const margin=Math.min(w,h)*p.marginPct/100;let x,y;
 if(p.manual){x=p.xPct*w/100;y=p.yPct*h/100}else{
 const col=p.grid.endsWith('L')?0:p.grid.endsWith('R')?2:1,row=p.grid.startsWith('T')?0:p.grid.startsWith('B')?2:1;
 x=col===0?margin:col===1?(w-width)/2:w-width-margin;y=row===0?margin:row===1?(h-height)/2:h-height-margin;
 }
 x=clamp(x,0,Math.max(0,w-width));y=clamp(y,0,Math.max(0,h-height));return{x,y,w:width,h:height,fontSize,position:p};
}
function renderElements(out,w,h,showSelection=false,item=activeItem()){
 for(const el of elements){const b=bounds(el,w,h,item,out);out.save();out.globalAlpha=clamp(Number(el.opacity??1),0,1);
  if(el.type==='image'&&el.img)out.drawImage(el.img,b.x,b.y,b.w,b.h);
  if(el.type==='text'){out.font=`${b.fontSize}px ${el.font||'Arial,sans-serif'}`;out.textBaseline='top';out.fillStyle=el.color||'#fff';String(el.text||'').split('\n').forEach((line,i)=>out.fillText(line,b.x,b.y+i*b.fontSize*1.28));}
  out.restore();
  if(showSelection&&el.id===selectedId){const hs=13;out.save();out.setLineDash([5,3]);out.strokeStyle='#7957df';out.lineWidth=2;out.strokeRect(b.x,b.y,b.w,b.h);out.setLineDash([]);out.fillStyle='#fff';out.strokeStyle='#7957df';out.fillRect(b.x+b.w-hs/2,b.y+b.h-hs/2,hs,hs);out.strokeRect(b.x+b.w-hs/2,b.y+b.h-hs/2,hs,hs);out.restore()}
 }
}
function draw(){const item=activeItem();if(item){if(canvas.width!==item.img.naturalWidth||canvas.height!==item.img.naturalHeight){canvas.width=item.img.naturalWidth;canvas.height=item.img.naturalHeight}ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(item.img,0,0);$('activeImageLabel').textContent=`${activeIndex+1} / ${baseItems.length} · ${item.file.name}`}
 else{if(canvas.width!==1200||canvas.height!==800){canvas.width=1200;canvas.height=800}ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#888';ctx.font='16px system-ui';ctx.fillText('上傳原圖，或先新增圖層開始編排',24,36);$('activeImageLabel').textContent='尚未選擇原圖'}renderElements(ctx,canvas.width,canvas.height,true,item)}
function renderImages(){const root=$('images');root.innerHTML='';if(!baseItems.length){root.innerHTML='<div class="list-empty">上傳一張或多張原圖</div>';return}baseItems.forEach((it,i)=>{const row=document.createElement('div');row.className='image-row'+(i===activeIndex?' active':'');const b=document.createElement('button');b.className='btn small';b.innerHTML=`<img class="thumb" src="${it.thumb}" alt="">${i+1}. ${escapeHtml(it.file.name)}`;b.onclick=()=>{activeIndex=i;renderImages();syncEditor();draw()};const del=document.createElement('button');del.className='btn small danger';del.textContent='×';del.title='移除原圖';del.onclick=()=>{baseItems.splice(i,1);if(!baseItems.length)activeIndex=-1;else if(activeIndex>=baseItems.length)activeIndex=baseItems.length-1;else if(i<activeIndex)activeIndex--;renderImages();syncEditor();draw()};row.append(b,del);root.append(row)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderLibrary(){const root=$('library'),assets=readAssets();root.innerHTML='';if(!assets.length){root.innerHTML='<div class="list-empty">選取圖層後可儲存，之後重複使用</div>';return}assets.forEach((a,i)=>{const row=document.createElement('div');row.className='asset-row';const use=document.createElement('button');use.className='btn small';if(a.type==='image'){const im=document.createElement('img');im.src=a.src;im.alt='';use.append(im)}else{const t=document.createElement('span');t.className='type';t.textContent='T';use.append(t)}use.append(document.createTextNode(a.name||'未命名素材'));use.onclick=()=>addAsset(a);const del=document.createElement('button');del.className='btn small danger';del.textContent='×';del.title='刪除素材';del.onclick=()=>{const list=readAssets();list.splice(i,1);if(writeAssets(list))renderLibrary()};row.append(use,del);root.append(row)})}
function renderLayers(){const root=$('layers');root.innerHTML='';$('layerCount').textContent=elements.length?`(${elements.length})`:'';if(!elements.length){root.innerHTML='<div class="list-empty">新增文字或圖片開始編排</div>';syncEditor();return}[...elements].reverse().forEach(el=>{const row=document.createElement('div');row.className='layer-row'+(el.id===selectedId?' selected':'');row.dataset.id=el.id;const b=document.createElement('button');b.className='btn small';b.textContent=`${el.type==='text'?'T':'▧'}  ${el.type==='text'?(el.text||'文字').replace(/\s+/g,' ').slice(0,22):(el.name||'圖片')}`;b.onclick=()=>{selectedId=el.id;renderLayers()};const d=document.createElement('button');d.className='btn small danger';d.textContent='×';d.title='刪除圖層';d.onclick=()=>removeLayer(el.id);row.append(b,d);root.append(row)});syncEditor()}
function syncEditor(){const el=getSelected(),editor=$('editor');editor.hidden=!el;if(!el)return;const isText=el.type==='text';document.querySelectorAll('.text-only').forEach(x=>x.style.display=isText?'':'none');$('contentLabel').textContent=isText?'文字內容':'圖層名稱';$('textContent').value=isText?el.text:(el.name||'');$('textContent').placeholder=isText?'輸入文字，可換行':'輸入圖層名稱';const p=getPosition(el);$('grid').value=p.manual?'MANUAL':p.grid;$('margin').value=p.marginPct;$('marginLabel').textContent=`${p.marginPct}%`;$('size').value=isText?el.sizePct:el.widthPct;$('opacity').value=Math.round((el.opacity??1)*100);$('textColor').value=el.color||'#ffffff';$('font').value=el.font||'Arial,sans-serif';$('assetName').value=el.name||''}
function removeLayer(id){elements=elements.filter(e=>e.id!==id);baseItems.forEach(it=>{if(it.positions)delete it.positions[id]});if(selectedId===id)selectedId=elements.at(-1)?.id||null;renderLayers();draw()}
function addText(text='新增文字'){const el={id:uid(),type:'text',name:text.slice(0,30)||'文字',text,color:'#ffffff',font:'Arial,sans-serif',sizePct:4,opacity:1,grid:'CC',marginPct:3,xPct:38,yPct:42};elements.push(el);selectedId=el.id;renderLayers();draw();status('已新增文字圖層，可直接拖曳調整位置。')}
async function addImage(file,offset=0){const img=await imageFromFile(file);const el={id:uid(),type:'image',name:file.name||'圖片素材',src:imageData(img),img,widthPct:24,opacity:1,grid:'CC',marginPct:3,xPct:34+offset,yPct:36+offset};elements.push(el);selectedId=el.id}
async function addAsset(a){try{const img=a.type==='image'?await imageFromData(a.src):null;const el={...a,id:uid(),img,grid:'CC',marginPct:3,xPct:37,yPct:40};elements.push(el);selectedId=el.id;renderLayers();draw();status(`已加入素材「${a.name}」。`)}catch{status('素材讀取失敗。')}}
async function uploadAssets(files){try{for(let i=0;i<files.length;i++)await addImage(files[i],i%4*3);renderLayers();draw();status(`已加入 ${files.length} 個圖片圖層。`)}catch{status('圖片載入失敗，請確認檔案格式。')}}
function storeAsset(){const el=getSelected();if(!el){status('請先選取要儲存的圖層。');return}const name=$('assetName').value.trim()||el.name;if(!name){status('請輸入素材名稱。');return}const a={...el,name};delete a.id;delete a.img;delete a.grid;delete a.marginPct;delete a.xPct;delete a.yPct;const list=readAssets(),i=list.findIndex(x=>x.name===name);if(i>=0)list[i]=a;else list.push(a);if(writeAssets(list)){el.name=name;renderLibrary();renderLayers();status(`素材「${name}」已儲存，可重複使用。`)}}
function mousePos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{const p=mousePos(e),item=activeItem();const el=getSelected();if(el){const b=bounds(el,canvas.width,canvas.height,item);if(p.x>=b.x+b.w-18&&p.x<=b.x+b.w+18&&p.y>=b.y+b.h-18&&p.y<=b.y+b.h+18&&el.type==='image'){pointer={mode:'resize',id:el.id,start:p,startWidth:el.widthPct,startBounds:b};canvas.setPointerCapture(e.pointerId);return}}
 for(let i=elements.length-1;i>=0;i--){const candidate=elements[i],b=bounds(candidate,canvas.width,canvas.height,item);if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){selectedId=candidate.id;const pos=getPosition(candidate,item);pointer={mode:'move',id:candidate.id,start:p,startX:b.x,startY:b.y,pos};renderLayers();canvas.setPointerCapture(e.pointerId);draw();return}}selectedId=null;renderLayers();draw()});
canvas.addEventListener('pointermove',e=>{if(!pointer)return;const el=elements.find(x=>x.id===pointer.id);if(!el)return;const p=mousePos(e),item=activeItem();if(pointer.mode==='move'){const dx=p.x-pointer.start.x,dy=p.y-pointer.start.y;savePosition(el,{...pointer.pos,manual:true,xPct:clamp((pointer.startX+dx)/canvas.width*100,0,100),yPct:clamp((pointer.startY+dy)/canvas.height*100,0,100)},item);$('grid').value='MANUAL'}else{const b=pointer.startBounds,f=Math.max((p.x-pointer.start.x)/Math.max(1,b.w),(p.y-pointer.start.y)/Math.max(1,b.h));el.widthPct=clamp(pointer.startWidth*(1+f),3,90);$('size').value=el.widthPct}draw()});
function stopPointer(){pointer=null}canvas.addEventListener('pointerup',stopPointer);canvas.addEventListener('pointercancel',stopPointer);
$('baseFiles').addEventListener('change',async e=>{const files=[...e.target.files||[]];try{for(const file of files){const img=await imageFromFile(file);const t=document.createElement('canvas');t.width=80;t.height=60;t.getContext('2d').drawImage(img,0,0,80,60);baseItems.push({file,img,thumb:t.toDataURL(),positions:{}})}if(activeIndex<0&&baseItems.length)activeIndex=0;renderImages();draw();status(`已載入 ${files.length} 張原圖。每張原圖的圖層位置會分開記錄。`)}catch{status('原圖載入失敗。')}e.target.value=''});
$('clearImages').onclick=()=>{baseItems=[];activeIndex=-1;renderImages();draw();status('已清空原圖。')};
$('addText').onclick=()=>addText();$('addImage').onclick=()=>$('assetFiles').click();$('assetFiles').addEventListener('change',e=>{uploadAssets([...e.target.files||[]]);e.target.value=''});
$('saveAsset').onclick=storeAsset;
$('textContent').addEventListener('input',e=>{const el=getSelected();if(!el)return;if(el.type==='text')el.text=e.target.value;else el.name=e.target.value;const row=[...$('layers').children].find(x=>x.dataset.id===el.id);if(row)row.querySelector('button').textContent=`${el.type==='text'?'T':'▧'}  ${el.type==='text'?(el.text||'文字').replace(/\s+/g,' ').slice(0,22):(el.name||'圖片')}`;draw()});
$('grid').addEventListener('change',e=>{const el=getSelected();if(!el)return;const p=getPosition(el);if(e.target.value==='MANUAL'){if(!p.manual){const b=bounds(el);savePosition(el,{...p,manual:true,xPct:b.x/canvas.width*100,yPct:b.y/canvas.height*100})}}else savePosition(el,{...p,grid:e.target.value,manual:false});draw()});
$('margin').addEventListener('input',e=>{const el=getSelected();if(!el)return;const p=getPosition(el);savePosition(el,{...p,marginPct:Number(e.target.value),manual:false});$('marginLabel').textContent=`${e.target.value}%`;draw()});
$('size').addEventListener('input',e=>{const el=getSelected();if(!el)return;if(el.type==='text')el.sizePct=Number(e.target.value);else el.widthPct=Number(e.target.value);draw()});$('opacity').addEventListener('input',e=>{const el=getSelected();if(el){el.opacity=Number(e.target.value)/100;draw()}});$('textColor').addEventListener('input',e=>{const el=getSelected();if(el?.type==='text'){el.color=e.target.value;draw()}});$('font').addEventListener('change',e=>{const el=getSelected();if(el?.type==='text'){el.font=e.target.value;draw()}});
$('delete').onclick=()=>{if(selectedId)removeLayer(selectedId)};$('duplicate').onclick=()=>{const el=getSelected();if(!el)return;const c={...el,id:uid(),name:(el.name||'素材')+' 副本'};elements.push(c);const p=getPosition(el);baseItems.forEach(it=>{it.positions ||= {};if(it.positions[el.id])it.positions[c.id]={...it.positions[el.id],manual:it.positions[el.id].manual,xPct:Math.min(94,p.xPct+4),yPct:Math.min(94,p.yPct+4)}});selectedId=c.id;renderLayers();draw()};$('raise').onclick=()=>{const i=elements.findIndex(e=>e.id===selectedId);if(i>=0){elements.push(elements.splice(i,1)[0]);renderLayers();draw()}};
$('resetPositions').onclick=()=>{const item=activeItem();if(!item)return;item.positions={};draw();syncEditor();status('已重設目前原圖所有圖層位置。')};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function exportItem(item){const out=document.createElement('canvas');out.width=item.img.naturalWidth;out.height=item.img.naturalHeight;const c=out.getContext('2d');c.drawImage(item.img,0,0);renderElements(c,out.width,out.height,false,item);if(!$('compress').checked)return new Promise(resolve=>out.toBlob(resolve,'image/jpeg',.92));let q=.92,blob;for(let i=0;i<10;i++){blob=await new Promise(resolve=>out.toBlob(resolve,'image/jpeg',q));if(blob.size<=Number($('maxMB').value||5)*1024*1024||q<=.42)break;q=Math.max(.42,q-.08)}return blob}
$('downloadOne').onclick=async()=>{const item=activeItem();if(!item){status('請先上傳原圖。');return}if(!elements.length){status('請先新增圖層。');return}try{const blob=await exportItem(item);download(blob,`素材_${item.file.name.replace(/\.[^.]+$/,'')}.jpg`);status(`完成，檔案約 ${(blob.size/1024/1024).toFixed(2)} MB。`)}catch{status('匯出失敗，請重試。')}};
$('downloadAll').onclick=async()=>{if(!baseItems.length){status('請先上傳原圖。');return}if(!elements.length){status('請先新增圖層。');return}for(let i=0;i<baseItems.length;i++){const item=baseItems[i];status(`正在輸出 ${i+1}/${baseItems.length}…`);const blob=await exportItem(item);download(blob,`素材_${String(i+1).padStart(2,'0')}_${item.file.name.replace(/\.[^.]+$/,'')}.jpg`);await new Promise(r=>setTimeout(r,150))}status(`已完成 ${baseItems.length} 張原圖輸出。`)};
renderLibrary();renderLayers();draw();
</script>
</body>
</html>
