<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>阿梅工具箱</title>
<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:rgba(0,0,0,.78);
    --muted:rgba(0,0,0,.45);
    --accent: rgb(110, 180, 135);
    --accentSoft: rgba(110, 180, 135, .12);
    --purple: rgb(167, 142, 220);
    --purpleSoft: rgba(167, 142, 220, .16);
    --shadow-sm: 0 10px 28px rgba(0,0,0,.08);
    --r:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC","Microsoft JhengHei", Arial;
  }

  .app{
    display:grid;
    grid-template-columns: 280px 1fr;
    gap: 14px;
    padding: 14px;
    height: 100vh;
  }
  @media (max-width: 900px){
    .app{ grid-template-columns: 1fr; height:auto; }
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow-sm);
  }

  .sidebar{
    padding: 12px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    min-width: 0;
  }

  .list{
    padding: 10px;
    display:flex;
    flex-direction:column;
    gap: 8px;
  }

  .preview{
    padding: 12px;
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
  }

  iframe{
    width:100%;
    height: 100%;
    border: 0;
    border-radius: 16px;
    background: #fff;
  }

  /* === Sidebar head === */
  .side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding: 6px 4px 2px;}
  .side-title{padding: 10px 12px;border-bottom:0;font-size: 22px;font-weight: 950; letter-spacing:.2px;}
  .side-gear{
    width: 32px !important;
    min-width: 32px;
    height: 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    padding:0 !important;
    flex-shrink:0;
    border: 1px solid rgba(0,0,0,.08);
    background: rgba(255,255,255,.88);
    cursor: pointer;
    font-size: 16px;
    transition: background .15s ease, transform .08s ease;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
  }
  .side-gear:hover{
    background: rgba(110,180,135,.18);
    transform: scale(1.08);
  }

  .side-search{width:100%;border:1px solid var(--border);border-radius: 14px;padding: 10px 12px;outline:none;background:#fff;font-weight: 700;color: rgba(0,0,0,.72);font-family:inherit;}
  .side-search:focus{border-color: rgba(110,180,135,.55);box-shadow: 0 0 0 4px rgba(110,180,135,.12);}

  .side-section{padding: 4px 12px 0;font-size: 11px;font-weight: 900;color: rgba(0,0,0,.38);letter-spacing:.8px;text-transform:uppercase;}

  /* category divider */
  .cat-label{
    padding: 2px 4px;
    font-size: 11px;
    font-weight: 900;
    color: rgba(0,0,0,.35);
    letter-spacing:.6px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat-label::after{
    content:"";
    flex:1;
    height:1px;
    background: rgba(0,0,0,.06);
  }

  /* tool list buttons */
  .list{padding: 6px 10px 10px;gap:6px;}
  .toolbtn{
    display:flex;align-items:center;justify-content:space-between;gap: 10px;
    border: 1px solid rgba(0,0,0,.09);
    background: rgba(255,255,255,.90);
    border-radius: 14px;
    padding: 10px 13px;
    box-shadow: 0 6px 18px rgba(0,0,0,.05);
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: transform .08s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .toolbtn:hover{background: rgba(249,250,251,1);transform: translateY(-1px);box-shadow: 0 10px 24px rgba(0,0,0,.08);}
  .toolbtn.active{
    border-color: rgba(110,180,135,.75);
    background: rgba(110,180,135,.08);
    box-shadow: 0 10px 26px rgba(110,180,135,.14);
  }
  .toolname{font-weight: 900;color: rgba(0,0,0,.82);font-size:13px;}
  .tooldesc{font-size: 11px;color: rgba(0,0,0,.42);margin-top: 2px;}
  .pill{
    border: 1px solid rgba(110,180,135,.22);
    background: rgba(110,180,135,.10);
    color: rgba(0,0,0,.60);
    font-size: 11px;
    font-weight: 900;
    padding: 5px 10px;
    border-radius: 999px;
    flex:0 0 auto;
    white-space: nowrap;
  }
  .pill.purple{
    border-color: rgba(167,142,220,.28);
    background: rgba(167,142,220,.12);
  }

  .side-foot{padding: 0 12px 12px;}
  .side-note{font-size:11px;color:var(--muted);line-height:1.6;background:rgba(0,0,0,.025);border-radius:12px;padding:8px 10px;}
</style>
</head>

<body>
  <div class="app">
    <div class="card sidebar">
      <div class="side-head">
        <div class="side-title">阿梅工具箱</div>
        <button class="side-gear" type="button" title="回到首頁" onclick="showHome()">🏠</button>
      </div>

      <input class="side-search" id="toolSearch" type="search" placeholder="搜尋工具…" oninput="filterTools()" />

      <div class="list" id="toolList">
        <div class="cat-label">管理</div>

        <button class="toolbtn" data-file="委託清單.html" onclick="openTool('委託清單.html')">
          <div>
            <div class="toolname">委託清單</div>
            <div class="tooldesc">快速追蹤稿件進度</div>
          </div>
          <div class="pill purple">管理</div>
        </button>

        <button class="toolbtn" data-file="該畫畫了.html" onclick="openTool('該畫畫了.html')">
          <div>
            <div class="toolname">畫畫清單</div>
            <div class="tooldesc">自訂待畫項目</div>
          </div>
          <div class="pill purple">管理</div>
        </button>

        <button class="toolbtn" data-file="阿梅備忘錄.html" onclick="openTool('阿梅備忘錄.html')">
          <div>
            <div class="toolname">阿梅備忘錄</div>
            <div class="tooldesc">分類待辦事項</div>
          </div>
          <div class="pill purple">管理</div>
        </button>

        <button class="toolbtn" data-file="便籤.html" onclick="openTool('便籤.html')">
          <div>
            <div class="toolname">便條紙</div>
            <div class="tooldesc">快速記錄小紙條</div>
          </div>
          <div class="pill purple">管理</div>
        </button>

        <div class="cat-label">圖像</div>

        <button class="toolbtn" data-file="阿梅浮水印工具.html" onclick="openTool('阿梅浮水印工具.html')">
          <div>
            <div class="toolname">浮水印工具</div>
            <div class="tooldesc">圖片浮水印、批次下載</div>
          </div>
          <div class="pill">圖像</div>
        </button>

        <button class="toolbtn" data-file="長圖拼接.html" onclick="openTool('長圖拼接.html')">
          <div>
            <div class="toolname">拼長圖工具</div>
            <div class="tooldesc">固定寬度拼接圖片</div>
          </div>
          <div class="pill">圖像</div>
        </button>

        <button class="toolbtn" data-file="文轉圖.html" onclick="openTool('文轉圖.html')">
          <div>
            <div class="toolname">文轉圖</div>
            <div class="tooldesc">長文字轉 PNG 圖片</div>
          </div>
          <div class="pill">圖像</div>
        </button>
      </div>

      <div class="side-foot">
        <div class="side-note">📁 請把各工具 html 放同一資料夾，工具箱才能正常打開。</div>
      </div>
    </div>

    <div class="card preview">
      <iframe id="toolFrame" src=""></iframe>
    </div>
  </div>

<script>
  function setActive(file){
    document.querySelectorAll('.toolbtn').forEach(btn=>{
      const f = btn.getAttribute('data-file');
      btn.classList.toggle('active', f === file);
    });
  }

  function openTool(src){
    const frame = document.getElementById('toolFrame');
    frame.removeAttribute('srcdoc');
    frame.src = src;
    setActive(src);
  }

  function showHome(){
    const frame = document.getElementById('toolFrame');
    frame.removeAttribute('src');

    const quotes = [
      "慢慢來也沒關係，但不要停下來。",
      "今天做一點點，明天就少一點點壓力。",
      "你不是拖延，你是在蓄力。",
      "先把第一筆線畫下去，後面就順了。",
      "休息也是進步的一部分。",
      "完成比完美更重要。"
    ];
    const q = quotes[Math.floor(Math.random()*quotes.length)];

    const tools = [
      { name:"委託清單", desc:"追蹤稿件進度", file:"委託清單.html", cat:"管理", emoji:"📋" },
      { name:"畫畫清單", desc:"自訂待畫項目", file:"該畫畫了.html", cat:"管理", emoji:"🎨" },
      { name:"阿梅備忘錄", desc:"分類待辦事項", file:"阿梅備忘錄.html", cat:"管理", emoji:"📝" },
      { name:"便條紙", desc:"快速記錄", file:"便籤.html", cat:"管理", emoji:"🗒️" },
      { name:"浮水印工具", desc:"圖片浮水印", file:"阿梅浮水印工具.html", cat:"圖像", emoji:"🖼️" },
      { name:"拼長圖", desc:"固定寬度拼接", file:"長圖拼接.html", cat:"圖像", emoji:"📐" },
      { name:"文轉圖", desc:"文字轉 PNG", file:"文轉圖.html", cat:"圖像", emoji:"✏️" },
    ];

    const toolCards = tools.map(t => `
      <button onclick="parent.openTool('${t.file}')" style="
        display:flex;align-items:center;gap:12px;
        border:1px solid rgba(0,0,0,.09);border-radius:14px;
        background:#fff;padding:12px 14px;
        cursor:pointer;text-align:left;width:100%;
        box-shadow:0 6px 16px rgba(0,0,0,.05);
        transition:transform .08s,background .15s;
        font-family:ui-sans-serif,system-ui,-apple-system,'PingFang TC',Arial;
      " onmouseover="this.style.transform='translateY(-1px)';this.style.background='#f9fafb'"
         onmouseout="this.style.transform='';this.style.background='#fff'">
        <span style="font-size:20px;flex-shrink:0;">${t.emoji}</span>
        <div>
          <div style="font-weight:900;font-size:13px;color:rgba(0,0,0,.82);">${t.name}</div>
          <div style="font-size:11px;color:rgba(0,0,0,.42);margin-top:2px;">${t.desc}</div>
        </div>
        <span style="margin-left:auto;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;
          background:${t.cat==='圖像'?'rgba(110,180,135,.10)':'rgba(167,142,220,.12)'};
          border:1px solid ${t.cat==='圖像'?'rgba(110,180,135,.22)':'rgba(167,142,220,.28)'};
          color:rgba(0,0,0,.55);white-space:nowrap;">${t.cat}</span>
      </button>
    `).join('');

    const doc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOME</title><style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#f3f4f6;font-family:ui-sans-serif,system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',Arial;padding:18px;color:rgba(0,0,0,.78);}
      .hero{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 22px;box-shadow:0 10px 28px rgba(0,0,0,.07);margin-bottom:14px;}
      .hero h2{font-size:18px;font-weight:950;margin-bottom:6px;color:rgba(0,0,0,.85);}
      .hero p{font-size:13px;color:rgba(0,0,0,.48);line-height:1.6;}
      .quote{margin-top:14px;padding:13px 16px;border-radius:14px;border:1px solid rgba(110,180,135,.28);background:rgba(110,180,135,.08);font-weight:900;color:rgba(0,0,0,.72);font-size:14px;line-height:1.5;}
      .section-label{font-size:11px;font-weight:900;color:rgba(0,0,0,.38);letter-spacing:.7px;text-transform:uppercase;margin-bottom:8px;padding:0 2px;}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
      @media(max-width:600px){.grid{grid-template-columns:1fr}}
    </style></head><body>
      <div class="hero">
        <h2>阿梅工具箱 🧰</h2>
        <p>今天也一起把事情做完吧。點左側工具或下方快速入口。</p>
        <div class="quote">${q}</div>
      </div>
      <div class="section-label">快速入口</div>
      <div class="grid">${toolCards}</div>
    </body></html>`;

    frame.srcdoc = doc;
    setActive('__HOME__');
  }

  function filterTools(){
    const q = (document.getElementById('toolSearch').value || '').trim().toLowerCase();
    document.querySelectorAll('#toolList .toolbtn').forEach(btn=>{
      const txt = btn.innerText.toLowerCase();
      btn.style.display = (!q || txt.includes(q)) ? '' : 'none';
    });
    // hide category labels if all buttons below are hidden
    document.querySelectorAll('#toolList .cat-label').forEach(label => {
      let sib = label.nextElementSibling;
      let anyVisible = false;
      while(sib && !sib.classList.contains('cat-label')){
        if(sib.style.display !== 'none') anyVisible = true;
        sib = sib.nextElementSibling;
      }
      label.style.display = anyVisible ? '' : 'none';
    });
  }

  window.addEventListener('load', ()=>{ showHome(); });
</script>

</body>
</html>
