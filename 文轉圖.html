<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>文轉圖</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:rgba(0,0,0,.78);
      --muted:rgba(0,0,0,.45);
      --accent:rgb(110,180,135);
      --accentSoft:rgba(110,180,135,.10);
      --accentBorder:rgba(110,180,135,.28);
      --shadow:0 10px 28px rgba(0,0,0,.07);
      --shadow-sm:0 6px 18px rgba(0,0,0,.05);
      --r:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:ui-sans-serif,system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",Arial;
      background:var(--bg);color:var(--text);
      padding:20px 16px 48px;
    }
    .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}

    .header{
      background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:18px 20px;box-shadow:var(--shadow);
    }
    .header h1{font-size:20px;font-weight:950;margin-bottom:4px;}
    .header p{font-size:12px;color:var(--muted);line-height:1.6;}

    .section{
      background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:16px 18px;box-shadow:var(--shadow-sm);
    }
    .section-title{
      font-size:13px;font-weight:900;color:rgba(0,0,0,.72);
      margin-bottom:12px;display:flex;align-items:center;gap:8px;
    }
    .section-title .num{
      width:22px;height:22px;border-radius:50%;background:var(--accent);
      color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }

    input[type="text"]{
      width:100%;font-size:13px;font-family:inherit;
      border:1px solid var(--border);border-radius:12px;
      padding:10px 13px;background:#fff;color:var(--text);outline:none;
    }
    input[type="text"]:focus{border-color:rgba(110,180,135,.6);box-shadow:0 0 0 4px rgba(110,180,135,.10);}

    textarea{
      width:100%;font-size:13px;font-family:inherit;
      border:1px solid var(--border);border-radius:12px;
      padding:10px 13px;min-height:160px;resize:vertical;
      background:#fff;color:var(--text);outline:none;line-height:1.6;
    }
    textarea:focus{border-color:rgba(110,180,135,.6);box-shadow:0 0 0 4px rgba(110,180,135,.10);}

    .hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px;}

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .inline{display:flex;gap:10px;flex-wrap:wrap;}
    .inline > div{flex:1;min-width:220px;}

    .chk-label{
      display:inline-flex;align-items:center;gap:8px;
      font-size:13px;font-weight:700;color:rgba(0,0,0,.72);cursor:pointer;
    }
    input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

    /* bg color pills */
    .bg-row{display:flex;flex-wrap:wrap;gap:8px;}
    .bg-option{
      display:inline-flex;align-items:center;gap:7px;
      padding:7px 13px;border-radius:999px;
      border:1px solid var(--border);background:#fff;cursor:pointer;
      font-size:12px;font-weight:700;font-family:inherit;
      transition:border-color .15s,background .15s;
    }
    .bg-option:has(input:checked){border-color:var(--accent);background:var(--accentSoft);}
    .bg-swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12);}

    /* sliders */
    .slider-group{display:flex;flex-direction:column;gap:14px;}
    .slider-row{display:flex;flex-direction:column;gap:4px;}
    .slider-label{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;}
    input[type="range"]{width:100%;accent-color:var(--accent);}

    /* buttons */
    .btn{
      border-radius:12px;border:1px solid var(--border);
      padding:11px 18px;font-size:13px;font-family:inherit;font-weight:900;
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
      transition:transform .06s,background .15s,box-shadow .15s;
      background:#fff;color:var(--text);
    }
    .btn:hover{background:#f9fafb;transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.07);}
    .btn:active{transform:translateY(0);}
    .btn.primary{background:rgba(0,0,0,.87);border-color:rgba(0,0,0,.87);color:#fff;}
    .btn.primary:hover{background:#111;border-color:#111;}
    .btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;}
    .btn.secondary{text-decoration:none;background:#fff;color:var(--text);}

    .status{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px;font-weight:700;}
    .status.error{color:#b00020;}

    .preview-box{
      margin-top:12px;border:1px solid var(--border);
      border-radius:14px;background:#fff;padding:10px;
      max-height:520px;overflow:auto;
    }
    .preview-box img{max-width:100%;display:block;margin:0 auto;border-radius:8px;}
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>文轉圖</h1>
    <p>輸出為寬度固定 <strong>800px</strong> 的 PNG 長條圖，適合投稿或分享。</p>
  </div>

  <!-- 1. 標題/副標/標籤 -->
  <div class="section">
    <div class="section-title"><span class="num">1</span>標題 / 副標 / 標籤</div>
    <div class="inline" style="gap:10px;">
      <div><input id="titleInput" type="text" placeholder="標題" /></div>
      <div><input id="cpInput" type="text" placeholder="副標（#CP 等）" /></div>
    </div>
    <div style="margin-top:8px;">
      <input id="tagInput" type="text" placeholder="標籤（用空格或 / 分隔）" />
    </div>
  </div>

  <!-- 2. 內文 -->
  <div class="section">
    <div class="section-title"><span class="num">2</span>內文</div>
    <textarea id="bodyInput" placeholder="把內文貼在這裡…（用空白行分段）"></textarea>
    <div class="row" style="margin-top:10px;">
      <label class="chk-label"><input id="indentOption" type="checkbox" /> 首行空兩格</label>
      <label class="chk-label"><input id="blankLineOption" type="checkbox" checked /> 段落間空一行</label>
    </div>
    <div class="hint">段落判定：用「空白行」或兩個以上換行分隔。</div>
  </div>

  <!-- 3. 背景顏色 -->
  <div class="section">
    <div class="section-title"><span class="num">3</span>背景顏色</div>
    <div class="bg-row">
      <label class="bg-option">
        <input type="radio" name="bgColorChoice" value="#FFFFFF" checked />
        <span class="bg-swatch" style="background:#FFFFFF;"></span>#FFFFFF 白
      </label>
      <label class="bg-option">
        <input type="radio" name="bgColorChoice" value="#E0E0E0" />
        <span class="bg-swatch" style="background:#E0E0E0;"></span>#E0E0E0 淺灰
      </label>
      <label class="bg-option">
        <input type="radio" name="bgColorChoice" value="#272727" />
        <span class="bg-swatch" style="background:#272727;border-color:rgba(255,255,255,.2)"></span>#272727 深灰
      </label>
    </div>
    <div class="hint">深色背景會用白色內容卡片，閱讀更穩。</div>
  </div>

  <!-- 4. 版面滑桿 -->
  <div class="section">
    <div class="section-title"><span class="num">4</span>版面調整</div>
    <div class="slider-group">
      <div class="slider-row">
        <div class="slider-label"><span>字體倍率</span><span id="fontScaleLabel">1.00×</span></div>
        <input id="fontScale" type="range" min="0.80" max="1.80" step="0.05" value="1.00">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>行距倍率</span><span id="lineScaleLabel">1.00×</span></div>
        <input id="lineScale" type="range" min="0.90" max="1.80" step="0.05" value="1.00">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>標題→內文空白</span><span id="gapLabel">18px</span></div>
        <input id="gapAfterMeta" type="range" min="0" max="600" step="10" value="18">
      </div>
    </div>
    <div class="hint">拉「標題→內文空白」可以在 meta 區和內文之間加入大片留白。</div>
  </div>

  <!-- 5. 產生 -->
  <div class="section">
    <div class="section-title"><span class="num">5</span>產生圖片</div>
    <div class="row">
      <button id="generateBtn" class="btn primary">生成圖片</button>
      <a id="downloadLink" class="btn secondary" href="#" download="text-long-800.png" style="display:none;">⬇️ 下載 PNG</a>
    </div>
    <div id="status" class="status"></div>
    <div id="previewWrap" class="preview-box" style="display:none;">
      <img id="previewImg" alt="預覽" />
    </div>
  </div>

</div>
<script>
  const WIDTH = 800;
  const titleInput = document.getElementById("titleInput");
  const cpInput = document.getElementById("cpInput");
  const tagInput = document.getElementById("tagInput");
  const bodyInput = document.getElementById("bodyInput");
  const indentOption = document.getElementById("indentOption");
  const blankLineOption = document.getElementById("blankLineOption");
  const fontScale = document.getElementById("fontScale");
  const lineScale = document.getElementById("lineScale");
  const gapAfterMeta = document.getElementById("gapAfterMeta");
  const fontScaleLabel = document.getElementById("fontScaleLabel");
  const lineScaleLabel = document.getElementById("lineScaleLabel");
  const gapLabel = document.getElementById("gapLabel");
  const generateBtn = document.getElementById("generateBtn");
  const downloadLink = document.getElementById("downloadLink");
  const previewWrap = document.getElementById("previewWrap");
  const previewImg = document.getElementById("previewImg");
  const statusEl = document.getElementById("status");

  function setStatus(msg, isError=false){
    statusEl.textContent = msg||"";
    statusEl.classList.toggle("error", isError);
  }

  function syncSliderLabels(){
    fontScaleLabel.textContent = Number(fontScale.value).toFixed(2)+"×";
    lineScaleLabel.textContent = Number(lineScale.value).toFixed(2)+"×";
    gapLabel.textContent = gapAfterMeta.value+"px";
  }
  syncSliderLabels();
  [fontScale,lineScale,gapAfterMeta].forEach(el=>el.addEventListener("input", syncSliderLabels));

  function getBgColor(){
    const checked = document.querySelector('input[name="bgColorChoice"]:checked');
    return checked ? checked.value : "#FFFFFF";
  }

  function wrapByChar(ctx, text, maxWidth){
    const lines=[]; let line="";
    for(const ch of text){
      if(ch==="\n"){ lines.push(line); line=""; continue; }
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line!==""){ lines.push(line); line=ch; }
      else{ line=test; }
    }
    lines.push(line);
    return lines;
  }

  function parseParagraphs(raw){
    const normalized=(raw||"").replace(/\r\n/g,"\n");
    return normalized.split(/\n{2,}/).map(p=>p.trimEnd()).filter(p=>p.trim()!=="");
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); ctx.fill();
  }

  function estimateLayout(){
    const bg=getBgColor();
    const title=(titleInput.value||"").trim();
    const cpRaw=(cpInput.value||"").trim();
    const cpLine=cpRaw?(cpRaw.startsWith("#")?cpRaw:"#"+cpRaw):"";
    const tagLine=(tagInput.value||"").trim();
    const paragraphs=parseParagraphs(bodyInput.value||"");
    const indent=indentOption.checked;
    const blankLine=blankLineOption.checked;

    const paddingOuter=24, cardPad=26, cardRadius=22;
    const cardX=paddingOuter, cardW=WIDTH-paddingOuter*2;
    const fs=Number(fontScale.value||1);
    const ls=Number(lineScale.value||1);
    const gapPx=Number(gapAfterMeta.value||18);

    const titleSize=Math.round(34*fs);
    const metaSize=Math.round(14*fs);
    const bodySize=Math.round(18*fs);
    const titleFont=`700 ${titleSize}px ui-sans-serif,system-ui,-apple-system,sans-serif`;
    const metaFont=`500 ${metaSize}px ui-sans-serif,system-ui,-apple-system,sans-serif`;
    const bodyFont=`400 ${bodySize}px ui-sans-serif,system-ui,-apple-system,sans-serif`;
    const titleLineHeight=Math.round(titleSize*1.30*ls);
    const metaLineHeight=Math.round(metaSize*1.45*ls);
    const bodyLineHeight=Math.round(bodySize*1.55*ls);

    const innerTextX=cardX+cardPad;
    const maxTextWidth=cardW-cardPad*2;
    const m=document.createElement("canvas").getContext("2d");
    let y=0;

    if(title){ m.font=titleFont; const tL=wrapByChar(m,title,maxTextWidth); y+=tL.length*titleLineHeight+Math.round(10*ls); }
    const metaText=[cpLine,tagLine].filter(Boolean).join("  ");
    if(metaText){ m.font=metaFont; const mL=wrapByChar(m,metaText,maxTextWidth); y+=mL.length*metaLineHeight+gapPx; }
    else{ y+=Math.min(gapPx,80); }

    m.font=bodyFont;
    let bodyLines=0;
    paragraphs.forEach((p,idx)=>{
      const l=wrapByChar(m,(indent?"　　":"")+p,maxTextWidth);
      bodyLines+=l.length;
      if(blankLine&&idx!==paragraphs.length-1) bodyLines+=1;
    });
    y+=bodyLines*bodyLineHeight;

    const cardH=cardPad+y+cardPad;
    const canvasH=paddingOuter+cardH+paddingOuter;
    return { bg,title,metaText,paragraphs,indent,blankLine,paddingOuter,cardPad,cardRadius,cardX,cardW,cardH,canvasH,innerTextX,maxTextWidth,titleFont,metaFont,bodyFont,titleLineHeight,metaLineHeight,bodyLineHeight,gapPx };
  }

  function render(){
    const layout=estimateLayout();
    if(!layout.title&&!layout.metaText&&layout.paragraphs.length===0){
      setStatus("請至少輸入標題／CP／標籤／內文其中一項。", true); return null;
    }
    const canvas=document.createElement("canvas");
    canvas.width=WIDTH; canvas.height=Math.max(200,Math.ceil(layout.canvasH));
    const ctx=canvas.getContext("2d");
    ctx.fillStyle=layout.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ffffff";
    roundRect(ctx,layout.cardX,layout.paddingOuter,layout.cardW,layout.cardH,layout.cardRadius);

    let y=layout.paddingOuter+layout.cardPad;
    if(layout.title){
      ctx.fillStyle="#222222"; ctx.font=layout.titleFont; ctx.textBaseline="top";
      wrapByChar(ctx,layout.title,layout.maxTextWidth).forEach(line=>{ ctx.fillText(line,layout.innerTextX,y); y+=layout.titleLineHeight; });
      y+=Math.round(10*Number(lineScale.value||1));
    }
    if(layout.metaText){
      ctx.fillStyle="#888888"; ctx.font=layout.metaFont; ctx.textBaseline="top";
      wrapByChar(ctx,layout.metaText,layout.maxTextWidth).forEach(line=>{ ctx.fillText(line,layout.innerTextX,y); y+=layout.metaLineHeight; });
      y+=layout.gapPx;
    } else { y+=Math.min(layout.gapPx,80); }
    ctx.fillStyle="#222222"; ctx.font=layout.bodyFont; ctx.textBaseline="top";
    const bodyIndent=layout.indent?"　　":"";
    layout.paragraphs.forEach((p,idx)=>{
      wrapByChar(ctx,bodyIndent+p,layout.maxTextWidth).forEach(line=>{ ctx.fillText(line,layout.innerTextX,y); y+=layout.bodyLineHeight; });
      if(layout.blankLine&&idx!==layout.paragraphs.length-1) y+=layout.bodyLineHeight;
    });
    return canvas;
  }

  generateBtn.addEventListener("click", ()=>{
    try{
      setStatus("正在生成圖片…");
      generateBtn.disabled=true;
      downloadLink.style.display="none";
      previewWrap.style.display="none";
      previewImg.src="";
      const canvas=render();
      if(!canvas){ generateBtn.disabled=false; return; }
      const dataURL=canvas.toDataURL("image/png");
      previewImg.src=dataURL; previewWrap.style.display="block";
      downloadLink.href=dataURL; downloadLink.style.display="inline-flex";
      setStatus(`完成！輸出寬度 ${WIDTH}px，高度約 ${canvas.height}px。`);
    }catch(e){
      setStatus("生成失敗：可能內容太長或瀏覽器限制。可試著分段輸出。", true);
    }finally{ generateBtn.disabled=false; }
  });
</script>
</body>
</html>
